<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Dimatice</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f10; --text:#f3f3f3; --muted:#cfcfcf; --accent:#FF6A00;
    --panel:#191a1c; --card:#1f2023; --radius:16px; --shadow:0 18px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:20;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
  .nav{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:12px 18px}
  .nav a{color:#fff;text-decoration:none;font-weight:700}
  .crumb{color:#cfcfcf;font-weight:600}
  main{max-width:1100px;margin:24px auto 60px;padding:0 18px}
  h1{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:800;margin-bottom:8px}
  .hint{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:18px}
  .card{grid-column:span 12;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  @media(min-width:900px){ .card{grid-column:span 6} }
  .media{background:#0f0f10;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;min-height:260px}
  .media img{display:block;max-width:100%;height:260px;object-fit:contain;background:#fff}
  .body{padding:18px}
  .badge{display:inline-block;margin-bottom:8px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:.85rem}
  h3{font-size:1.1rem;margin-bottom:6px}
  .desc{color:#d6d6d6}
  .price{margin-top:12px;font-size:1.12rem;font-weight:900}
  .back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;border:2px solid #fff;padding:8px 12px;border-radius:12px;font-weight:800}
  .back:hover{background:#fff;color:#000}
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html">Protein Power Lab</a>
      <span class="crumb">· Catálogo Dimatice</span>
    </nav>
  </header>

  <main>
    <h1>Catálogo · Dimatice</h1>
    <p class="hint">Precios en ARS. Sabores entre paréntesis (si aplica).</p>

    <section class="grid">
      <!-- ÚNICO PRODUCTO -->
      <article class="card">
        <div class="media">
          <!-- Tu archivo de imagen -->
          <img src="assets/img/iso-100-proteina.jpg" alt="ISO100 Hidrolizada 5 lb - Vainilla Gourmet">
        </div>
        <div class="body">
          <span class="badge">Proteína</span>
          <h3>ISO100 Hidrolizada 5 lb (Vainilla Gourmet)</h3>
          <p class="desc">100% proteína de suero aislada e hidrolizada. Disolución excelente.</p>
          <div class="price">$ 400.000</div>
        </div>
      </article>
    </section>

    <a class="back" href="index.html">← Volver</a>
  </main>
</body>
</html>
