<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catálogo · Dymatize</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f0f10; --panel:#f3efe9; --text:#111; --muted:#666; --accent:#FF6A00;
      --radius:18px; --shadow:0 24px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}
    .bg{position:fixed; inset:0; z-index:-2; background:#111; filter:brightness(.9)}
    .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(1200px 600px at 50% 8%, rgba(255,106,0,.18), transparent 60%),linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.65))}
    header{position:sticky; top:0; z-index:2; background:rgba(15,15,16,.55); border-bottom:1px solid rgba(255,255,255,.08); backdrop-filter:blur(6px)}
    .nav{max-width:1100px;margin:0 auto;display:flex;gap:16px;align-items:center;padding:14px 18px}
    .breadcrumb{color:#ddd}
    .title{max-width:1100px;margin:22px auto 8px;padding:0 18px;font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:800}
    .note{max-width:1100px;margin:0 auto 12px;padding:0 18px;color:#ddd}

    .product{
      max-width:1100px;margin:18px auto 30px;padding:0 18px;background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow)
    }
    .media{background:#fff; display:flex; align-items:center; justify-content:center; padding:18px}
    .media img{width:360px; max-width:100%; height:auto; object-fit:contain; display:block}
    .body{padding:18px}
    .badge{display:inline-block;background:rgba(255,255,255,.1); padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.2); font-size:.9rem; margin-bottom:10px}
    h2{font-weight:800;margin:2px 0 6px}
    .desc{color:#e9e9e9}
    .price{margin-top:12px;font-size:1.2rem;font-weight:900;color:#fff}
    .back{display:inline-block;margin:16px 18px 20px;padding:10px 14px;border-radius:12px;background:rgba(255,106,0,.14);border:1px solid rgba(255,106,0,.35);color:#ffd6b8;text-decoration:none;font-weight:800}
    .back:hover{filter:brightness(1.03)}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header>
    <nav class="nav">
      <span class="breadcrumb">Catálogo · <strong>Dymatize</strong></span>
      <a class="back" style="margin-left:auto" href="index.html">← Volver</a>
    </nav>
  </header>

  <h1 class="title">Catálogo · Dymatize</h1>
  <p class="note">Precios en ARS. Los sabores están aclarados entre paréntesis (si aplica).</p>

  <!-- Producto -->
  <article class="product">
    <div class="media">
      <!-- imagen sobre FONDO BLANCO -->
      <img src="iso-100-proteina.jpg" alt="ISO100 Hidrolizada 5 lb (Vainilla Gourmet)">
    </div>
    <div class="body">
      <span class="badge">Proteína</span>
      <h2>ISO100 Hidrolizada 5 lb (Vainilla Gourmet)</h2>
      <p class="desc">100% proteína de suero aislada e hidrolizada. Disolución excelente.</p>
      <div class="price">$ 400.000</div>
    </div>
  </article>

  <a class="back" href="index.html">← Volver</a>
</body>
</html>
