<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo · Dymatize</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0f0f10; --text:#f3f3f3; --muted:#cfcfcf; --accent:#FF6A00;
      --card:#ffffff; --radius:18px; --shadow:0 18px 60px rgba(0,0,0,.45);
      --chip:#232325;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
    .bg{position:fixed;inset:0;z-index:-2;background:url('assets/img/bg-texture.jpg') center/cover no-repeat;filter:brightness(.85) contrast(1.03)}
    .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 50% 15%, rgba(255,106,0,.20), transparent 60%), linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.65))}
    header{position:sticky;top:0;z-index:10;background:rgba(15,15,16,.55);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
    .nav{max-width:1200px;margin:0 auto;display:flex;gap:14px;align-items:center;padding:14px 20px}
    .brand{font-weight:800}
    .right{margin-left:auto}
    .btn{background:var(--accent);color:#111;border:none;padding:10px 14px;border-radius:12px;font-weight:800;text-decoration:none}
    main{max-width:1200px;margin:28px auto 80px;padding:0 20px}
    .title{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
    .title img{width:40px;height:40px;object-fit:contain;filter:grayscale(100%) brightness(.13)}
    .title h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
    .card{grid-column:span 12;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;color:#111}
    @media(min-width:900px){.card{grid-column:span 12}}
    .media{background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;border-bottom:1px solid rgba(0,0,0,.08)}
    .media img{max-width:520px;width:100%;height:360px;object-fit:contain}
    .body{padding:18px}
    .chip{display:inline-block;background:var(--chip);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;font-size:.83rem;margin-bottom:8px}
    .name{font-size:1.15rem;font-weight:900;margin:4px 0 6px}
    .desc{color:#333}
    .price{margin-top:12px;font-weight:900;font-size:1.15rem}
    .back{margin-top:18px;display:inline-block}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <nav class="nav">
      <strong class="brand">Protein Power Lab</strong>
      <span class="right"><a class="btn" href="index.html">Volver</a></span>
    </nav>
  </header>

  <main>
    <div class="title">
      <img src="assets/img/dymatize.jpg" alt="Dymatize">
      <h1>Catálogo · Dymatize</h1>
    </div>

    <section class="grid">
      <!-- Producto único ISO100 -->
      <article class="card">
        <div class="media">
          <img src="assets/img/iso-100-proteina.jpg" alt="Dymatize ISO100 Hidrolizada 5 lb Vainilla Gourmet">
        </div>
        <div class="body">
          <span class="chip">Proteína</span>
          <div class="name">ISO100 Hidrolizada 5 lb (Vainilla Gourmet)</div>
          <p class="desc">100% proteína de suero aislada e hidrolizada. Disolución excelente.</p>
          <div class="price">$ 400.000</div>
          <a class="back btn" href="index.html">Volver</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
