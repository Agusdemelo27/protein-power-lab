<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Dymatize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0e0f;--muted:#cfcfcf;--text:#f3f3f3;--accent:#FF6A00;--radius:16px;--shadow:0 20px 60px rgba(0,0,0,.55)}
  *{box-sizing:border-box;margin:0;padding:0} html,body{height:100%}
  body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-2;background:url('assets/img/bg-texture.jpg') center/cover no-repeat;filter:contrast(1.02) brightness(.8)}
  .bg::after{content:"";position:absolute;inset:0;z-index:-1;background:
    radial-gradient(1200px 600px at 50% 0, rgba(255,106,0,.15), transparent 60%),
    radial-gradient(1200px 600px at 50% 100%, rgba(255,255,255,.12), transparent 60%),
    linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.6))}
  header{position:sticky;top:0;z-index:50;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
  .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 20px}
  .logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
  .logo img{height:44px;width:44px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.1);background:#000}
  .brand{font-weight:800;letter-spacing:.4px}
  main{max-width:1200px;margin:28px auto 80px;padding:0 20px}
  .title{display:flex;gap:14px;align-items:center;margin:6px 0 16px}
  .title img{height:42px;width:42px;object-fit:contain;filter:contrast(.96) brightness(.96)}
  .title h1{font-size:clamp(1.6rem,3.2vw,2.2rem);line-height:1.1;font-weight:800}
  .title small{color:var(--muted)}

  .filters{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
  .input,.select{background:#fff;color:#111;border:none;border-radius:12px;padding:12px 14px;font-weight:600;min-width:220px}
  .input::placeholder{color:#6b6b6b} select.select option{color:#111;background:#fff}

  .group{margin:30px 0 36px}
  .group h2{font-weight:800;letter-spacing:.3px;margin:0 0 14px;color:#fff}
  .group h2 .chip{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.8rem;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .card{grid-column:span 12;background:rgba(20,20,21,.88);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transform:translateY(12px);opacity:0;transition:transform .6s cubic-bezier(.2,.7,.2,1), opacity .6s}
  .card.in{transform:translateY(0);opacity:1}
  .media{background:#0f0f10;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;min-height:220px}
  .media img{display:block;width:100%;height:260px;object-fit:contain;filter:none !important;opacity:1 !important;background:#fff}
  .badge{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.55);padding:6px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;font-size:.8rem}
  .body{padding:18px}.body h3{font-size:1.12rem;color:#fff;margin-bottom:6px;font-weight:800}.body p{color:#d6d6d6;font-size:.98rem}
  .price{margin-top:10px;font-weight:900;font-size:1.1rem;color:#fff}.price .nostock{color:#ffcf9e;background:rgba(255,106,0,.14);padding:3px 8px;border-radius:8px;border:1px solid rgba(255,106,0,.3)}
  @media(min-width:768px){ .card{grid-column:span 6} .media img{height:240px} }
  @media(min-width:1200px){ .card{grid-column:span 4} .media img{height:220px} }
  .foot{margin-top:36px;color:#cfcfcf;font-size:.9rem;text-align:center;border-top:1px solid rgba(255,255,255,.08);padding:22px 0}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header>
  <nav class="nav">
    <a class="logo" href="index.html"><img src="assets/img/logo.jpg" alt=""><span class="brand">Protein Power Lab</span></a>
    <div style="margin-left:auto;color:#cfcfcf">Catálogo • <strong>Dymatize</strong></div>
  </nav>
</header>

<main>
  <div class="title">
    <img src="assets/img/dymatize.jpg" alt="Dymatize">
    <div>
      <h1>Catálogo · Dymatize</h1>
      <small>Elegí tu producto. Los sabores están aclarados entre paréntesis. Precios en ARS.</small>
    </div>
  </div>

  <div class="filters">
    <input id="q" class="input" placeholder="Buscar... (ej: creatina, whey, iso)">
    <select id="cat" class="select">
      <option value="todas">Todas las categorías</option>
      <option value="creatina">Creatina</option>
      <option value="proteina">Proteína</option>
      <option value="pre">Pre-entreno</option>
      <option value="multi">Multivitamínico</option>
      <option value="salud">Salud</option>
    </select>
    <select id="sort" class="select">
      <option value="rec">Orden: recomendado</option>
      <option value="precioAsc">Menor precio</option>
      <option value="precioDesc">Mayor precio</option>
      <option value="az">A-Z</option>
    </select>
  </div>

  <section class="group" id="g-creatina"><h2>Creatina <span class="chip" id="c-creatina">0</span></h2><div class="grid" data-cat="creatina"></div></section>
  <section class="group" id="g-proteina"><h2>Proteína <span class="chip" id="c-proteina">0</span></h2><div class="grid" data-cat="proteina"></div></section>
  <section class="group" id="g-pre"><h2>Pre-entreno <span class="chip" id="c-pre">0</span></h2><div class="grid" data-cat="pre"></div></section>
  <section class="group" id="g-multi"><h2>Multivitamínico <span class="chip" id="c-multi">0</span></h2><div class="grid" data-cat="multi"></div></section>
  <section class="group" id="g-salud"><h2>Salud <span class="chip" id="c-salud">0</span></h2><div class="grid" data-cat="salud"></div></section>

  <div class="foot">© 2025 Protein Power Lab</div>
</main>

<script>
  const IMG_BASE = 'assets/img/';

  // Productos ejemplo Dymatize (podés editar nombres, precios e imágenes).
  const PRODUCTS = [
    // CREATINAS
    {cat:'creatina', name:'Creatine Monohydrate 300g', price:null, img:'dym_creatine_300.jpg', desc:'Monohidratada, micronizada.'},

    // PROTEÍNAS
    {cat:'proteina', name:'ISO100 2.3kg (chocolate, vainilla, cookies)', price:null, img:'dym_iso100_23.jpg', desc:'Aisalada, rápida absorción.'},
    {cat:'proteina', name:'Elite Whey 2lb (vainilla, chocolate, strawberry)', price:null, img:'dym_elite_whey_2lb.jpg', desc:'Whey concentrada y aislada.'},

    // PRE
    {cat:'pre', name:'Pre W.O. (citrus, watermelon)', price:null, img:'dym_prewo.jpg', desc:'Energía y enfoque.'},

    // MULTI (si no hay, dejá vacío o con “Sin stock”)
    {cat:'multi', name:'Multivitamínico (men/women)', price:null, img:'dym_multi.jpg', desc:'Vitaminas y minerales.'}
  ];

  const q = document.getElementById('q');
  const cat = document.getElementById('cat');
  const sort = document.getElementById('sort');

  const io = new IntersectionObserver((entries)=>entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.18});

  const label = c => ({creatina:'Creatina',proteina:'Proteína',pre:'Pre-entreno',multi:'Multivitamínico',salud:'Salud'}[c]||c);
  const pesos = v => v.toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});

  function card(p){
    const priceHtml = (p.price && p.price>0) ? `<div class="price">${pesos(p.price)}</div>` : `<div class="price"><span class="nostock">Sin stock</span></div>`;
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = `
      <div class="media"><img loading="lazy" src="${IMG_BASE + p.img}" alt="${p.name}"></div>
      <div class="body">
        <div class="badge">${label(p.cat)}</div>
        <h3>${p.name}</h3>
        <p>${p.desc||''}</p>
        ${priceHtml}
      </div>`;
    io.observe(el);
    return el;
  }

  function render(){
    document.querySelectorAll('.grid').forEach(g=>g.innerHTML='');
    const term = (q.value||'').trim().toLowerCase();
    const catVal = cat.value;

    let data = PRODUCTS.filter(p=>{
      const byCat = (catVal==='todas') || (p.cat===catVal);
      const byTerm = !term || p.name.toLowerCase().includes(term) || (p.desc||'').toLowerCase().includes(term);
      return byCat && byTerm;
    });

    if (sort.value==='precioAsc') data.sort((a,b)=>(a.price||1e12)-(b.price||1e12));
    if (sort.value==='precioDesc') data.sort((a,b) => (b.price||-1)-(a.price||-1));
    if (sort.value==='az') data.sort((a,b)=>a.name.localeCompare(b.name));

    const counts = {creatina:0,proteina:0,pre:0,multi:0,salud:0};
    data.forEach(p=>counts[p.cat]++);
    Object.keys(counts).forEach(k=>{
      const badge = document.getElementById('c-'+k);
      const sec = document.getElementById('g-'+k);
      if (badge) badge.textContent = counts[k];
      if (sec) sec.style.display = counts[k] ? '' : 'none';
    });

    data.forEach(p=>{
      const g = document.querySelector(`.grid[data-cat="${p.cat}"]`);
      if (g) g.appendChild(card(p));
    });
  }

  q.addEventListener('input', render);
  cat.addEventListener('change', render);
  sort.addEventListener('change', render);
  render();
</script>
</body>
</html>
