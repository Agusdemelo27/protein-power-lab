<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Dymatize</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0f; --muted:#cfcfcf; --text:#f3f3f3;
    --accent:#FF6A00; --radius:16px; --shadow:0 20px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

  /* Fondo con leve luz naranja (igual que star.html reciente) */
  .bg{position:fixed;inset:0;z-index:-2;background:url('assets/img/bg-texture.jpg') center/cover no-repeat;filter:contrast(1.02) brightness(.82)}
  .bg::after{content:"";position:absolute;inset:0;background:
    radial-gradient(1100px 520px at 50% 0, rgba(255,106,0,.16), transparent 60%),
    linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.6))}

  header{position:sticky;top:0;z-index:50;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
  .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
  .logo img{height:40px;width:40px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.1);background:#000}
  .brand{font-weight:800}
  .right{margin-left:auto;color:var(--muted);font-size:.95rem}
  .back{margin-left:14px;background:var(--accent);color:#111;font-weight:800;border:none;border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 6px 18px rgba(255,106,0,.3)}
  .back:hover{transform:translateY(-1px)}

  main{max-width:1200px;margin:26px auto 80px;padding:0 20px}
  .title{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
  .title img{height:42px;width:42px;object-fit:contain}
  .title h1{font-size:clamp(1.55rem,3vw,2.2rem);line-height:1.1;font-weight:800}
  .title h1 span{background:linear-gradient(90deg,var(--accent),#ff9440);-webkit-background-clip:text;background-clip:text;color:transparent}
  .title small{color:var(--muted)}

  /* Filtros (mismos estilos) */
  .filters{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
  .input,.select{
    background:#fffaf6;color:#111;border:1px solid rgba(255,106,0,.25);
    border-radius:12px;padding:12px 14px;font-weight:700;min-width:220px;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }
  .input::placeholder{color:#6b6b6b}
  .input:focus,.select:focus{outline:none;box-shadow:0 0 0 3px rgba(255,106,0,.25)}

  .group{margin:30px 0 36px}
  .group h2{font-weight:900;letter-spacing:.3px;margin:0 0 14px;position:relative}
  .group h2::after{content:"";position:absolute;left:0;bottom:-6px;width:72px;height:3px;background:linear-gradient(90deg,var(--accent),transparent);border-radius:2px}
  .group h2 .chip{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;background:rgba(255,106,0,.12);color:#ffd9c2;font-size:.8rem;border:1px solid rgba(255,106,0,.24)}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .card{grid-column:span 12;background:rgba(25,25,26,.9);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transform:translateY(10px);opacity:0;transition:transform .5s,opacity .5s}
  .card.in{transform:translateY(0);opacity:1}
  .media{background:#0f0f10;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;min-height:220px}
  .media img{display:block;width:100%;height:260px;object-fit:contain;background:#fff}
  .body{padding:18px}
  .badge{display:inline-block;margin-bottom:8px;background:rgba(255,106,0,.12);color:#ffd9c2;padding:6px 10px;border:1px solid rgba(255,106,0,.25);border-radius:999px;font-size:.85rem;font-weight:800}
  .body h3{font-size:1.12rem;color:#fff;margin:4px 0 6px;font-weight:800}
  .body p{color:#dcdcdc;font-size:.98rem}
  .price{margin-top:10px;font-weight:900;font-size:1.1rem;color:#fff}
  .price .nostock{color:#ffcf9e;background:rgba(255,106,0,.14);padding:3px 8px;border-radius:8px;border:1px solid rgba(255,106,0,.3)}

  @media(min-width:768px){ .card{grid-column:span 6} .media img{height:240px} }
  @media(min-width:1200px){ .card{grid-column:span 4} .media img{height:220px} }

  .foot{margin-top:36px;color:var(--muted);font-size:.9rem;text-align:center;border-top:1px solid rgba(255,255,255,.08);padding:22px 0}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header>
  <nav class="nav">
    <a class="logo" href="index.html"><img src="assets/img/logo.jpg" alt=""><span class="brand">Protein Power Lab</span></a>
    <div class="right">Catálogo • <strong>Dymatize</strong>
      <button class="back" onclick="location.href='index.html#marcas'">Volver</button>
    </div>
  </nav>
</header>

<main>
  <div class="title">
    <img src="assets/img/dymatize.jpg" alt="Dymatize">
    <div>
      <h1>Catálogo · <span>Dymatize</span></h1>
      <small>Elegí tu producto. Precios en ARS.</small>
    </div>
  </div>

  <!-- Filtros: dejo solo Proteína para que quede limpio -->
  <div class="filters">
    <input id="q" class="input" placeholder="Buscar... (ej: iso100, whey)">
    <select id="cat" class="select">
      <option value="todas">Todas las categorías</option>
      <option value="proteina">Proteína</option>
    </select>
    <select id="sort" class="select">
      <option value="rec">Orden: recomendado</option>
      <option value="precioAsc">Menor precio</option>
      <option value="precioDesc">Mayor precio</option>
      <option value="az">A-Z</option>
    </select>
  </div>

  <!-- ÚNICO grupo visible -->
  <section class="group" id="g-proteina">
    <h2>Proteína Importada<span class="chip" id="c-proteina">0</span></h2>
    <div class="grid" data-cat="proteina"></div>
  </section>

  <div class="foot">© 2025 Protein Power Lab</div>
</main>

<script>
  const IMG_BASE = 'assets/img/';

  // Dataset Dymatize: solo ISO100 5lb Vanilla Gourmet
  const PRODUCTS = [
    {
      cat:'proteina',
      name:'ISO100 Hydrolyzed 5lb (Vainilla Gourmet)',
      price:400000,
      img:'iso-100-proteina.jpg', // asegurate del nombre exacto y acentos
      desc:'Proteína de suero 100% aislada e hidrolizada. 2,3 kg (5LB).'
    }
  ];

  const q = document.getElementById('q');
  const cat = document.getElementById('cat');
  const sort = document.getElementById('sort');

  const io = new IntersectionObserver((entries)=>entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.18});

  const label = c => ({proteina:'Proteína'}[c]||c);
  const pesos = v => v.toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});

  function card(p){
    const priceHtml = (p.price && p.price>0)
      ? `<div class="price">${pesos(p.price)}</div>`
      : `<div class="price"><span class="nostock">Sin stock</span></div>`;
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = `
      <div class="media"><img loading="lazy" src="${IMG_BASE + p.img}" alt="${p.name}"></div>
      <div class="body">
        <span class="badge">${label(p.cat)}</span>
        <h3>${p.name}</h3>
        <p>${p.desc||''}</p>
        ${priceHtml}
      </div>`;
    io.observe(el);
    return el;
  }

  function render(){
    document.querySelectorAll('.grid').forEach(g=>g.innerHTML='');
    const term = (q.value||'').trim().toLowerCase();
    const catVal = cat.value;

    let data = PRODUCTS.filter(p=>{
      const byCat = (catVal==='todas') || (p.cat===catVal);
      const byTerm = !term || p.name.toLowerCase().includes(term) || (p.desc||'').toLowerCase().includes(term);
      return byCat && byTerm;
    });

    if (sort.value==='precioAsc') data.sort((a,b)=>(a.price||1e12)-(b.price||1e12));
    if (sort.value==='precioDesc') data.sort((a,b)=>(b.price||-1)-(a.price||-1));
    if (sort.value==='az') data.sort((a,b)=>a.name.localeCompare(b.name));

    const counts = {proteina:0};
    data.forEach(p=>counts[p.cat]++);
    const el = document.getElementById('c-proteina');
    if (el) el.textContent = counts.proteina;
    document.getElementById('g-proteina').style.display = counts.proteina ? '' : 'none';

    data.forEach(p=>{
      const g = document.querySelector(`.grid[data-cat="${p.cat}"]`);
      if (g) g.appendChild(card(p));
    });
  }

  q.addEventListener('input', render);
  cat.addEventListener('change', render);
  sort.addEventListener('change', render);
  render();
</script>
</body>
</html>
