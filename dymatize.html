<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catálogo · Dymatize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f0f10;
      --text:#f6f6f6;
      --muted:#cfcfcf;
      --accent:#ff6a00;
      --panel:#171719;
      --card:#fdfdfd;      /* fondo blanco para la foto del producto */
      --radius:16px;
      --shadow:0 20px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    .bg{position:fixed;inset:0;z-index:-2;background:url('assets/img/bg-texture.jpg') center/cover no-repeat;filter:contrast(1.02) brightness(.9)}
    .bg::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 35% at 50% 10%, rgba(255,106,0,.22), transparent 60%), linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.8))}

    header{position:sticky;top:0;z-index:40;background:rgba(15,15,16,.55);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 18px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
    .brand img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.12)}
    .brand span{font-weight:800}
    .back{margin-left:auto}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 28px rgba(255,106,0,.35)}

    main{max-width:1100px;margin:28px auto 80px;padding:0 18px}
    .title{display:flex;gap:14px;align-items:center;margin:8px 0 16px}
    .title img{height:44px;width:auto;object-fit:contain;filter:none}
    .title h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}

    .card{
      background:var(--panel);border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
    }
    .media{background:var(--card);display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.08)}
    .media img{display:block;width:100%;max-width:520px;height:340px;object-fit:contain}

    .body{padding:18px}
    .chip{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:.86rem;margin-bottom:10px}
    h3{font-size:1.18rem;font-weight:800;margin:6px 0 8px}
    p{color:#d7d7d7}
    .price{margin-top:12px;font-size:1.18rem;font-weight:900}

    footer{border-top:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.82)}
    .foot{max-width:1100px;margin:0 auto;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .foot small{color:#bebebe}
    .social{display:flex;gap:10px}
    .social a{display:inline-flex;width:28px;height:28px}
    .social img{width:100%;height:100%;object-fit:contain;border-radius:4px}

    /* WhatsApp flotante */
    .wa{
      position:fixed;right:18px;bottom:18px;z-index:50;width:58px;height:58px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;background:#25D366;border:2px solid #128C7E;box-shadow:0 10px 30px rgba(0,0,0,.4)
    }
    .wa img{width:60%;height:60%;object-fit:contain}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <nav class="nav">
      <a class="brand" href="index.html">
        <img src="assets/img/logo.jpg" alt="Protein Power Lab">
        <span>Protein Power Lab</span>
      </a>
      <div class="back">
        <a class="btn" href="index.html#marcas">← Volver</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="title">
      <img src="assets/img/dymatize.jpg" alt="Dymatize">
      <h1>Catálogo · Dymatize</h1>
    </div>

    <section class="card">
      <div class="media">
        <img src="assets/img/iso-100-proteina.jpg" alt="ISO100 Hidrolizada 5 lb (Vainilla Gourmet)">
      </div>
      <div class="body">
        <span class="chip">Proteína</span>
        <h3>ISO100 Hidrolizada 5 lb (Vainilla Gourmet)</h3>
        <p>100% proteína de suero aislada e hidrolizada. Disolución excelente.</p>
        <div class="price">$ 400.000</div>
      </div>
    </section>
  </main>

  <footer>
    <div class="foot">
      <small>© 2025 Protein Power Lab.</small>
      <div class="social">
        <a href="https://www.instagram.com/protein_power_lab" target="_blank" rel="noopener">
          <img src="assets/img/instagram.jpg" alt="Instagram">
        </a>
        <a href="https://www.facebook.com/" target="_blank" rel="noopener">
          <img src="assets/img/facebook.jpg" alt="Facebook">
        </a>
      </div>
    </div>
  </footer>

  <!-- WhatsApp flotante -->
  <a class="wa" href="https://wa.me/541123014207?text=Hola%20Protein%20Power%20Lab!%20Quiero%20ISO100%20Dymatize" target="_blank" rel="noopener">
    <img src="assets/img/whatsapp.jpg" alt="WhatsApp">
  </a>
</body>
</html>
