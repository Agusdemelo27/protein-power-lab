<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · Dimatize</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0e0e0f;--muted:#cfcfcf;--text:#f3f3f3;--accent:#FF6A00;--radius:16px;--shadow:0 20px 60px rgba(0,0,0,.45)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text)}

    .bg{position:fixed;inset:0;z-index:-2;
      background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
      filter:contrast(1.02) brightness(.85);}
    .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(1200px 600px at 50% 0, rgba(255,106,0,.15), transparent 60%),linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.6))}

    header{position:sticky;top:0;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);}
    .nav{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
    .logo{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
    .logo img{height:44px;width:44px;border-radius:10px;background:#000;object-fit:cover}
    .brand{font-weight:800}

    main{max-width:1200px;margin:40px auto;padding:0 20px}
    .title{display:flex;gap:14px;align-items:center;margin-bottom:20px}
    .title img{height:44px;width:44px;object-fit:contain}
    .title h1{font-weight:800;font-size:1.8rem}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
    .card{background:rgba(255,255,255,.1);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;text-align:center;padding:20px}
    .media img{width:100%;height:240px;object-fit:contain;background:#fff}
    .body h3{margin:12px 0;font-weight:800}
    .price{font-weight:900;font-size:1.2rem;color:#fff}

    footer{margin-top:40px;border-top:1px solid rgba(255,255,255,.1);padding:20px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <div class="bg"></div>

  <header>
    <nav class="nav">
      <a class="logo" href="index.html">
        <img src="assets/img/logo.jpg" alt="Protein Power Lab">
        <span class="brand">Protein Power Lab</span>
      </a>
      <span>Catálogo • Dimatize</span>
    </nav>
  </header>

  <main>
    <div class="title">
      <img src="assets/img/dimatize.jpg" alt="Dimatize">
      <h1>Catálogo · Dimatize</h1>
    </div>

    <div class="grid">
      <div class="card">
        <div class="media">
          <img src="assets/img/iso-100-proteina.jpg" alt="ISO100 Proteína">
        </div>
        <div class="body">
          <h3>ISO100 Proteína Hidrolizada (vainilla gourmet, 5 lbs / 2.3 kg)</h3>
          <div class="price">$400.000</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    © 2025 Protein Power Lab
  </footer>
</body>
</html>
