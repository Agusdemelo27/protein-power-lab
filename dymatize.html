<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Dymatize</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0e0f;--muted:#cfcfcf;--text:#f3f3f3;--accent:#FF6A00;--radius:16px;--shadow:0 20px 60px rgba(0,0,0,.55)}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text)}

  .bg{position:fixed;inset:0;z-index:-2;background:url('assets/img/bg-texture.jpg') center/cover no-repeat;filter:contrast(1.05) brightness(.85)}
  header{position:sticky;top:0;z-index:50;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
  .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 20px}
  .logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
  .logo img{height:44px;width:44px;border-radius:10px;object-fit:cover;background:#000}
  .brand{font-weight:800}

  main{max-width:1200px;margin:28px auto 80px;padding:0 20px}
  .title{display:flex;gap:14px;align-items:center;margin:6px 0 16px}
  .title img{height:48px;width:48px;object-fit:contain}
  .title h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800}
  .title small{color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .card{background:#fff;color:#000;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .media{display:flex;align-items:center;justify-content:center;background:#fff}
  .media img{width:100%;height:260px;object-fit:contain}
  .body{padding:18px}
  .body h3{font-weight:800;margin-bottom:6px}
  .price{margin-top:10px;font-weight:900;font-size:1.1rem;color:#000}

  .foot{margin-top:36px;color:var(--muted);font-size:.9rem;text-align:center;border-top:1px solid rgba(255,255,255,.1);padding:22px 0}
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <nav class="nav">
    <a class="logo" href="index.html"><img src="assets/img/logo.jpg" alt=""><span class="brand">Protein Power Lab</span></a>
    <div class="right">Catálogo • <strong>Dymatize</strong></div>
  </nav>
</header>

<main>
  <div class="title">
    <img src="assets/img/dymatize.jpg" alt="Dymatize">
    <div>
      <h1>Catálogo · Dymatize</h1>
      <small>ISO100 Hidrolizada Whey Protein – Vainilla Gourmet – 5LB (2,3kg)</small>
    </div>
  </div>

  <div class="grid">
    <article class="card">
      <div class="media"><img src="assets/img/iso-100-proteina.jpg" alt="ISO100"></div>
      <div class="body">
        <h3>ISO100 Hidrolizada Whey Protein 5LB</h3>
        <p>Sabor Vainilla Gourmet. Aislada al 100% de suero.</p>
        <div class="price">$400.000</div>
      </div>
    </article>
  </div>

  <div class="foot">© 2025 Protein Power Lab</div>
</main>
</body>
</html>
