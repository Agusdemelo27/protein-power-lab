<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · ENA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0e0e0f;
    --muted:#cfcfcf;
    --text:#f3f3f3;
    --accent:#FF6A00;
    --radius:16px;
    --shadow:0 20px 60px rgba(0,0,0,.55)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body {
    font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column
  }
  .bg {
    position:fixed;inset:0;z-index:-2;
    background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
    filter:contrast(1.02) brightness(.82)
  }
  .bg::after {
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(1100px 520px at 50% 0, rgba(255,106,0,.16), transparent 60%),
               linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.6))
  }

  header {
    position:sticky;top:0;z-index:50;
    background:rgba(14,14,15,.6);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.06)
  }
  .nav {
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:12px 20px
  }
  .logo {
    display:flex;align-items:center;gap:12px;
    text-decoration:none;color:#fff;
    margin-right:auto
  }
  .logo img {
    height:40px;width:40px;border-radius:10px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.1);
    background:#000
  }
  .brand{font-weight:800}
  .pill{display:none!important}
  .right{margin-left:auto;font-size:0}
  .right .back {
    font-size:.95rem;display:inline-flex;align-items:center;
    background:var(--accent);color:#111;font-weight:800;
    border:none;border-radius:999px;
    padding:8px 14px;cursor:pointer;
    box-shadow:0 6px 18px rgba(255,106,0,.3)
  }

  main {
    max-width:1200px;margin:26px auto 80px;padding:0 20px
  }
  .title {
    display:flex;gap:14px;align-items:center;
    margin:4px 0 14px
  }
  .title img{height:42px;width:42px;object-fit:contain}
  .title h1 {
    font-size:clamp(1.55rem,3vw,2.2rem);
    line-height:1.1;font-weight:800
  }
  .title small{color:var(--muted)}

  .filters {
    display:flex;gap:12px;flex-wrap:wrap;
    margin:18px 0 8px
  }
  .input,.select {
    background:#fffaf6;color:#111;
    border:1px solid rgba(255,106,0,.25);
    border-radius:12px;
    padding:12px 14px;font-weight:700;
    min-width:220px;
    box-shadow:0 6px 18px rgba(0,0,0,.08)
  }

  .group{margin:30px 0 36px}
  .group h2 {
    font-weight:900;letter-spacing:.3px;
    margin:0 0 14px;position:relative
  }

  .grid {
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:18px
  }
  .card {
    grid-column:span 12;
    background:rgba(25,25,26,.9);
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    transform:translateY(10px);
    opacity:0;
    transition:transform .5s,opacity .5s
  }
  .card.in{transform:translateY(0);opacity:1}

  footer {
    border-top:1px solid rgba(255,255,255,.08);
    background:rgba(10,10,10,.9);
    backdrop-filter:blur(6px);
    margin-top:auto
  }
  .foot {
    width:100%;
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 40px
  }

  .socials{display:flex;gap:12px;margin-left:auto;margin-right:100px}
  .socials a{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:8px}
</style>
</head>

<body>
<div class="bg"></div>

<header>
  <nav class="nav">
    <a class="logo" href="index.html">
      <img src="assets/img/logo.jpg"><span class="brand">Power Lab</span>
    </a>
    <div class="right">
      <button class="back" onclick="location.href='index.html#marcas'">Volver</button>
    </div>
  </nav>
</header>

<main>
  <div class="title">
    <img src="assets/img/ena.jpg">
    <div>
      <h1>Catálogo · ENA</h1>
      <small>Elegí tu producto. Precios en ARS.</small>
    </div>
  </div>

  <div class="filters">
    <input id="q" class="input" placeholder="Buscar...">
    <select id="cat" class="select">
      <option value="todas">Todas las categorías</option>
      <option value="creatina">Creatina</option>
      <option value="proteina">Proteína</option>
    </select>

    <select id="sort" class="select">
      <option value="rec">Orden: recomendado</option>
      <option value="precioAsc">Menor precio</option>
      <option value="precioDesc">Mayor precio</option>
      <option value="az">A-Z</option>
    </select>
  </div>

  <section class="group" id="g-creatina">
    <h2>Creatina <span class="chip" id="c-creatina">0</span></h2>
    <div class="grid" data-cat="creatina"></div>
  </section>

  <section class="group" id="g-proteina">
    <h2>Proteína <span class="chip" id="c-proteina">0</span></h2>
    <div class="grid" data-cat="proteina"></div>
  </section>
</main>

<footer>
  <div class="foot">
    <small>© 2025 Power Lab · proteinpowerlab@gmail.com</small>
    <div class="socials">
      <a class="facebook" href="https://www.facebook.com/share/19rj9UoysD/" target="_blank"></a>
      <a class="instagram" href="https://www.instagram.com/powerlab_arg" target="_blank"></a>
    </div>
  </div>
</footer>

<a href="https://wa.me/5491171484334" target="_blank" class="whatsapp-fab">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M16 3c-7 0-13 6-13 13..." /></svg>
</a>

<script>
const IMG_BASE = 'assets/img/';
const PRODUCTS=[

  {
    cat:'proteina',
    name:'ENA Whey Protein 2LB (vainilla, chocolate, frutilla, cookies, banana)',
    price:58000,
    img:'ena_Whey_Protein_2LB_vainilla_chocolate_frutilla_cookies_banana.jpg',
    desc:'Excelente disolución y alto valor biológico.'
  },

  {
    cat:'creatina',
    name:'ENA Creatina 300g',
    price:32000,
    img:'ena_Creatina_300g.jpg',
    desc:'Creatina monohidratada pura y micronizada.'
  },

  {
    cat:'proteina',
    name:'ENA Whey Protein 500g',
    price:0,
    img:'Creatina_500g.jpg',
    desc:'Proteína concentrada de rápida absorción. Ideal para después del entrenamiento.'
  },

  {
    cat:'proteina',
    name:'ENA Multivitamínico',
    price:0,
    img:'MultiVitaminico.jpg',
    desc:'Fórmula completa para energía, defensa inmune y bienestar general.'
  }

];

const q=document.getElementById('q'),
      cat=document.getElementById('cat'),
      sort=document.getElementById('sort');

const io=new IntersectionObserver((es)=>
  es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  }),{threshold:.18}
);

const label=c=>({creatina:'Creatina',proteina:'Proteína'}[c]||c);

const pesos=v=>v.toLocaleString('es-AR',{
  style:'currency',currency:'ARS',maximumFractionDigits:0
});

function card(p){
  const priceHtml=(p.price&&p.price>0)
    ? `<div class="price">${pesos(p.price)}</div>`
    : `<div class="price"><span class="nostock">Sin stock</span></div>`;

  const el=document.createElement('article');
  el.className='card';
  el.innerHTML=`
    <div class="media">
      <img loading="lazy" src="${IMG_BASE+p.img}" alt="${p.name}">
    </div>
    <div class="body">
      <span class="badge">${label(p.cat)}</span>
      <h3>${p.name}</h3>
      <p>${p.desc||''}</p>
      ${priceHtml}
    </div>`;
  io.observe(el);
  return el;
}

function render(){
  document.querySelectorAll('.grid').forEach(g=>g.innerHTML='');

  const term=(q.value||'').trim().toLowerCase();
  const catVal=cat.value;

  let data=PRODUCTS.filter(p=>{
    const byCat=(catVal==='todas')||(p.cat===catVal);
    const byTerm=!term||p.name.toLowerCase().includes(term)||(p.desc||'').toLowerCase().includes(term);
    return byCat&&byTerm;
  });

  if(sort.value==='precioAsc') data.sort((a,b)=>(a.price||1e12)-(b.price||1e12));
  if(sort.value==='precioDesc') data.sort((a,b)=>(b.price||-1)-(a.price||-1));
  if(sort.value==='az') data.sort((a,b)=>a.name.localeCompare(b.name));

  const counts={creatina:0,proteina:0};
  data.forEach(p=>counts[p.cat]++);

  Object.keys(counts).forEach(k=>{
    const el=document.getElementById('c-'+k);
    if(el) el.textContent=counts[k];
    const sec=document.getElementById('g-'+k);
    if(sec) sec.style.display=counts[k]?'':'none';
  });

  data.forEach(p=>{
    const g=document.querySelector(`.grid[data-cat="${p.cat}"]`);
    if(g) g.appendChild(card(p));
  });
}

q.addEventListener('input',render);
cat.addEventListener('change',render);
sort.addEventListener('change',render);

render();
</script>

</body>
</html>
