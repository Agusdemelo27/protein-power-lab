<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · ENA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0e0e0f;
  --muted:#cfcfcf;
  --text:#f3f3f3;
  --accent:#FF6A00;
  --radius:16px;
  --shadow:0 20px 60px rgba(0,0,0,.55)
}

*{box-sizing:border-box;margin:0;padding:0}

body {
  font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.bg {
  position:fixed;inset:0;z-index:-2;
  background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
  filter:contrast(1.02) brightness(.82)
}
.bg::after {
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(1100px 520px at 50% 0, rgba(255,106,0,.16), transparent 60%), 
             linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.6))
}

/* Header */
header {
  position:sticky;top:0;z-index:50;
  background:rgba(14,14,15,.6);
  backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.06)
}
.nav {width:100%; display:flex;align-items:center;gap:12px; padding:12px 20px}
.logo {display:flex;align-items:center;gap:12px; text-decoration:none;color:#fff; margin-right:auto}
.logo img {height:40px;width:40px;border-radius:10px; object-fit:cover; border:1px solid rgba(255,255,255,.1); background:#000}
.brand{font-weight:800}
.pill{display:none!important}
.right{margin-left:auto;font-size:0}
.right .back {
  font-size:.95rem;display:inline-flex;align-items:center;
  background:var(--accent);color:#111;font-weight:800;
  border:none;border-radius:999px;
  padding:8px 14px;cursor:pointer;
  box-shadow:0 6px 18px rgba(255,106,0,.3)
}
.right .back:hover{transform:translateY(-1px)}

/* Contenido */
main {max-width:1200px;margin:26px auto 80px;padding:0 20px}

.title { display:flex;gap:14px;align-items:center; margin:4px 0 14px }
.title img{height:42px;width:42px;object-fit:contain}
.title h1 { font-size:clamp(1.55rem,3vw,2.2rem); line-height:1.1;font-weight:800 }
.title small{color:var(--muted)}

.filters { display:flex;gap:12px;flex-wrap:wrap; margin:18px 0 8px }
.input,.select {
  background:#fffaf6;color:#111;
  border:1px solid rgba(255,106,0,.25);
  border-radius:12px;
  padding:12px 14px;font-weight:700;
  min-width:220px;
  box-shadow:0 6px 18px rgba(0,0,0,.08)
}
.input::placeholder{color:#6b6b6b}
.input:focus,.select:focus {
  outline:none;
  box-shadow:0 0 0 3px rgba(255,106,0,.25)
}

.group{margin:30px 0 36px}
.group h2 {
  font-weight:900;letter-spacing:.3px;
  margin:0 0 14px;position:relative
}
.group h2::after {
  content:"";position:absolute;left:0;bottom:-6px;
  width:72px;height:3px;
  background:linear-gradient(90deg,var(--accent),transparent);
  border-radius:2px
}
.group h2 .chip {
  display:inline-block;margin-left:8px;
  padding:3px 8px;border-radius:999px;
  background:rgba(255,106,0,.12);
  color:#ffd9c2;font-size:.8rem;
  border:1px solid rgba(255,106,0,.24)
}

.grid {
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:18px
}

.card {
  grid-column:span 12;
  background:rgba(25,25,26,.9);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  transform:translateY(10px);
  opacity:0;
  transition:transform .5s,opacity .5s
}
.card.in{transform:translateY(0);opacity:1}

.media {
  background:#0f0f10;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  min-height:220px;
}
.media img {
  display:block;width:100%;height:260px;
  object-fit:contain;background:#fff
}

.body{padding:18px}

/* ✔ badge eliminado */
.badge{display:none!important}

/* ✔ Alinear precios y sin stock al fondo */
.body{
  display:flex;
  flex-direction:column;
  min-height:160px;
}

.price, .nostock{
  margin-top:auto;
}

.body h3 {
  font-size:1.12rem;color:#fff;
  margin:4px 0 6px;font-weight:800
}
.body p{color:#dcdcdc;font-size:.98rem}

.price { margin-top:10px;font-weight:900; font-size:1.1rem;color:#fff }

.nostock {
  color:#ffcf9e;
  background:rgba(255,106,0,.14);
  padding:3px 8px;
  border-radius:8px;
  border:1px solid rgba(255,106,0,.3);
  display:inline-block;
  font-weight:800;
}

/* responsive */
@media(min-width:768px){
  .card{grid-column:span 6}
  .media img{height:240px}
}
@media(min-width:1200px){
  .card{grid-column:span 4}
  .media img{height:220px}
}

/* Footer */
footer {
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(10,10,10,.9);
  backdrop-filter:blur(6px);
  margin-top:auto
}
.foot {
  width:100%;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 40px
}
.foot small{color:#b5b5b5;margin-left:0}

.socials{display:flex;gap:12px;margin-left:auto;margin-right:100px}
.socials a { width:46px;height:46px; display:flex;align-items:center;justify-content:center; border-radius:8px }

.socials a.facebook{background:#1877F2}
.socials a.facebook svg{fill:#fff;width:24px;height:24px}

.socials a.instagram {
  background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%)
}
.socials a.instagram svg{fill:#fff;width:24px;height:24px}

.whatsapp-fab {
  position:fixed;right:18px;bottom:18px;z-index:9999;
  width:68px;height:68px;border-radius:50%;
  background:#25D366;
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.08);
  display:grid;place-items:center;
  text-decoration:none;transition:transform .15s
}
.whatsapp-fab:hover{transform:translateY(-2px)}
.whatsapp-fab svg{width:36px;height:36px;fill:#fff;display:block}

</style>
</head>

<body>

<div class="bg" aria-hidden="true"></div>

<header>
  <nav class="nav">
    <a class="logo" href="index.html">
      <img src="assets/img/logo.jpg" alt="">
      <span class="brand">Power Lab</span>
    </a>
    <div class="right">
      <button class="back" onclick="location.href='index.html#marcas'">Volver</button>
    </div>
  </nav>
</header>

<main>
  <div class="title">
    <img src="assets/img/ena.jpg" alt="ENA">
    <div>
      <h1>Catálogo · ENA</h1>
      <small>Elegí tu producto. Precios en ARS.</small>

  </div>

  <div class="filters">
    <input id="q" class="input" placeholder="Buscar...">
    <select id="cat" class="select">

      <option value="creatina">Creatina</option>

      <option value="vitaminas">Vitaminas</option>

    <select id="sort" class="select">
      <option value="rec">Orden: recomendado</option>

    <div class="grid" data-cat="vitaminas"></div>
  </section>

</main>

<script>

const IMG_BASE='assets/img/';

const PRODUCTS=[
  {
    cat:'proteina',
    name:'ENA Whey Protein 2LB (vainilla, chocolate, frutilla, cookies, banana)',
    price:58000,
    img:'ena_Whey_Protein_2LB_vainilla_chocolate_frutilla_cookies_banana.jpg',
    desc:'Excelente disolución.'
  },
  {
    cat:'creatina',
    name:'ENA Creatina 300g',
    price:32000,
    img:'ena_Creatina_300g.jpg',
    desc:'Pura y micronizada.'
  },

  /* NUEVOS AGREGADOS */
  {
    cat:'vitaminas',
    name:'ENA Multivitamínico',
    price:0,                       // SIN STOCK
    img:'MultiVitaminico.jpg',
    desc:'Multivitamínico completo ENA.'
  },

  {
    cat:'proteina',
    name:'ENA Whey Protein 1LB (500g)',
    price:37000,                   // $37.000
    img:'Prote_500g.jpg',
    desc:'Presentación 1LB (500g).'
  }
];

const q=document.getElementById('q'),
      cat=document.getElementById('cat'),
      sort=document.getElementById('sort');

const io=new IntersectionObserver((es)=>
  es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  }),{threshold:.18}
);

const label=c=>({creatina:'Creatina',proteina:'Proteína',vitaminas:'Vitaminas'}[c]||c);

const pesos=v=>v.toLocaleString('es-AR',{
  style:'currency',
  currency:'ARS',
  maximumFractionDigits:0
});

/* CARD */
function card(p){
  const priceHtml = (p.price && p.price > 0)
    ? `<div class="price">${pesos(p.price)}</div>`
    : `<div class="price"><span class="nostock">Sin stock</span></div>`;

  const src = /^https?:/i.test(p.img) ? p.img : (IMG_BASE + p.img);
  const el=document.createElement('article');
  el.className='card';

  el.innerHTML = `
    <div class="media">
      <img loading="lazy" src="${src}" alt="${p.name}">
    </div>
    <div class="body">
      <h3>${p.name}</h3>
      <p>${p.desc || ''}</p>
      ${priceHtml}
    </div>
  `;

  io.observe(el);
  return el;
}

function render(){
  document.querySelectorAll('.grid').forEach(g=>g.innerHTML='');

  const term=(q.value||'').trim().toLowerCase();
  const catVal=cat.value;

  let data=PRODUCTS.filter(p=>{
    const byCat=(catVal==='todas')||(p.cat===catVal);
    const byTerm=!term || p.name.toLowerCase().includes(term) || (p.desc||'').toLowerCase().includes(term);
    return byCat&&byTerm;
  });

  if(sort.value==='precioAsc') data.sort((a,b)=>(a.price||1e12)-(b.price||1e12));
  if(sort.value==='precioDesc') data.sort((a,b)=>(b.price||-1)-(a.price||-1));
  if(sort.value==='az') data.sort((a,b)=>a.name.localeCompare(b.name));

  const counts={creatina:0,proteina:0,vitaminas:0};
  data.forEach(p=>counts[p.cat]++);

  Object.keys(counts).forEach(k=>{
    const el=document.getElementById('c-'+k);
    if(el) el.textContent=counts[k];
    const sec=document.getElementById('g-'+k);
    if(sec) sec.style.display=counts[k]?'':'none';
  });

  data.forEach(p=>{
    const g=document.querySelector(`.grid[data-cat="${p.cat}"]`);
    if(g) g.appendChild(card(p));
  });
}

q.addEventListener('input',render);
cat.addEventListener('change',render);
sort.addEventListener('change',render);

render();

</script>

</body>
