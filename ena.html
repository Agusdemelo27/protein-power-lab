<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catálogo · ENA</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ---------- BASE ---------- */
body {
  margin: 0;
  padding: 0;
  background: #0c0c0c;
  font-family: "Montserrat", sans-serif;
  color: #fff;
}

/* ---------- HEADER ---------- */
header {
  background: #0c0c0c;
  padding: 20px 0;
  text-align: center;
  border-bottom: 1px solid #1f1f1f;
}

header img {
  width: 190px;
}

/* ---------- BANNER ---------- */
.banner {
  width: 100%;
  height: 260px;
  background: url("assets/img/banner_ena.jpg") center/cover no-repeat;
  border-bottom: 2px solid #ff004c;
  box-shadow: 0 0 30px #ff004c44;
}

/* ---------- TÍTULO PRINCIPAL ---------- */
h1 {
  font-size: 2.8rem;
  text-align: center;
  margin-top: 40px;
  font-weight: 900;
  color: #ff004c;
  text-shadow: 0 0 18px #ff004c;
  letter-spacing: 1px;
}

/* ---------- SECCIÓN MARCA ---------- */
.brand-section {
  max-width: 1300px;
  margin: 50px auto;
  padding: 0 20px;
}

.brand-title {
  text-align: center;
  font-size: 2.2rem;
  font-weight: 900;
  margin-bottom: 35px;
  text-shadow: 0 0 18px #ff004c;
}

/* ---------- GRID DE PRODUCTOS ---------- */
.product-grid {
  display: grid;
  gap: 30px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}

.product-card {
  background: #141414;
  border-radius: 20px;
  padding: 18px;
  border: 1px solid #2a2a2a;
  box-shadow: 0 0 12px #000;
  transition: .25s;
  text-align: center;
}

.product-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 0 18px #ff004c;
}

.product-card img {
  width: 100%;
  height: 240px;
  object-fit: contain;
}

/* ---------- NOMBRE Y PRECIO ---------- */
.product-name {
  margin: 12px 0 6px;
  font-size: 1.15rem;
  font-weight: 700;
}

.product-price {
  font-size: 1.5rem;
  font-weight: 800;
  color: #ff004c;
  text-shadow: 0 0 10px #ff004c77;
}

/* ---------- BOTÓN ---------- */
.buy-btn {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: #ff004c;
  color: #fff;
  border: none;
  border-radius: 15px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.buy-btn:hover {
  background: #ff2b6d;
}

/* ---------- SIN STOCK ---------- */
.out-of-stock {
  opacity: .55;
}

.out-of-stock .buy-btn {
  background: #555;
  cursor: not-allowed;
}

/* ---------- FOOTER ---------- */
footer {
  background: #0a0a0a;
  padding: 60px 20px;
  text-align: center;
  margin-top: 80px;
  border-top: 1px solid #1f1f1f;
  box-shadow: 0 -10px 25px #000;
}

.footer-title {
  font-size: 1.5rem;
  font-weight: 900;
  margin-bottom: 25px;
  color: #ff004c;
  text-shadow: 0 0 12px #ff004c;
}

/* ICONOS REDES */
.social-icons {
  margin-bottom: 25px;
}

.social-icons img {
  width: 50px;
  margin: 0 15px;
  transition: .25s;
  filter: drop-shadow(0 0 6px #ff004c);
}

.social-icons img:hover {
  transform: scale(1.2);
  filter: drop-shadow(0 0 10px #ff2b6d);
}

.copy {
  margin-top: 20px;
  opacity: .7;
  font-size: .9rem;
  letter-spacing: .5px;
}

/* ---------- WHATSAPP FLOTANTE ---------- */
.whatsapp-float {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 999;
}

.whatsapp-float img {
  width: 75px;
  transition: .2s;
  filter: drop-shadow(0 0 6px #25d366);
}

.whatsapp-float img:hover {
  transform: scale(1.18);
  filter: drop-shadow(0 0 12px #25d366);
}
</style>
</head>

<body>

<header>
  <img src="assets/img/logo_powerlab.png" alt="PowerLab" />
</header>

<div class="banner"></div>

<h1>Catálogo ENA</h1>

<section class="brand-section">
  <h2 class="brand-title">Productos ENA</h2>

  <div class="product-grid">

    <!-- CREATINA -->
    <div class="product-card">
      <img src="assets/img/creatina_ena.jpg" alt="Creatina ENA">
      <h3 class="product-name">Creatina ENA Mono 300g</h3>
      <p class="product-price">$32.000</p>
      <button class="buy-btn">Comprar</button>
    </div>

    <!-- WHEY 2LB -->
    <div class="product-card">
      <img src="assets/img/ena_whey_2lb.jpg" alt="Whey ENA 2LB">
      <h3 class="product-name">Whey ENA 2LB</h3>
      <p class="product-price">$8.000</p>
      <button class="buy-btn">Comprar</button>
    </div>

    <!-- WHEY 1LB -->
    <div class="product-card">
      <img src="assets/img/ena_whey_1lb.jpg" alt="Whey ENA 1LB">
      <h3 class="product-name">Whey ENA 1LB</h3>
      <p class="product-price">$37.000</p>
      <button class="buy-btn">Comprar</button>
    </div>

    <!-- MULTIVITAMINICO -->
    <div class="product-card out-of-stock">
      <img src="assets/img/ena_multi.jpg" alt="Multivitamínico ENA">
      <h3 class="product-name">Multivitamínico ENA</h3>
      <p class="product-price">SIN STOCK</p>
      <button class="buy-btn" disabled>No disponible</button>
    </div>

  </div>
</section>

<footer>
  <p class="footer-title">Seguinos en nuestras redes</p>

  <div class="social-icons">
    <a href="https://instagram.com"><img src="assets/img/ig.png"></a>
    <a href="https://tiktok.com"><img src="assets/img/tiktok.png"></a>
    <a href="https://facebook.com"><img src="assets/img/facebook.png"></a>
  </div>

  <p class="copy">© 2025 PowerLab · Todos los derechos reservados</p>
</footer>

<a class="whatsapp-float" href="https://wa.me/5490000000">
  <img src="assets/img/whatsapp.png">
</a>

</body>
</html>
