<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · ENA</title>

<!-- Fuente -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- ============================
   🎨 ESTILOS GENERALES (IGUAL A STAR)
============================= -->
<style>
  :root {
    --bg:#0e0e0f; --muted:#cfcfcf; --text:#f3f3f3;
    --accent:#FF6A00; --radius:16px;
    --shadow:0 20px 60px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Montserrat',system-ui,-apple-system;
    background:var(--bg);color:var(--text);
    overflow-x:hidden;min-height:100vh;
    display:flex;flex-direction:column;
  }

  /* Fondo */
  .bg{
    position:fixed;inset:0;z-index:-2;
    background:url('assets/img/bg-texture.jpg') center/cover;
    filter:contrast(1.02) brightness(.82);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(1100px 520px at 50% 0, rgba(255,106,0,.16), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.6));
  }

  /* HEADER */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(14,14,15,.6);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .nav{
    display:flex;align-items:center;gap:12px;
    padding:12px 20px;width:100%;
  }
  .logo{
    display:flex;align-items:center;gap:12px;
    text-decoration:none;color:white;
  }
  .logo img{
    height:40px;width:40px;border-radius:10px;
    object-fit:cover;border:1px solid rgba(255,255,255,.1);
  }
  .brand{font-weight:800}
  .back{
    background:var(--accent);color:#111;
    padding:8px 14px;font-weight:800;
    border:none;border-radius:999px;
    cursor:pointer;
  }

  /* CONTENIDO */
  main{
    max-width:1200px;margin:26px auto 80px;
    padding:0 20px;
  }
  .title{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .title img{height:42px;width:42px}
  .title h1{font-size:2rem;font-weight:800}

  /* FILTROS */
  .filters{
    display:flex;gap:12px;flex-wrap:wrap;
    margin:18px 0 8px;
  }
  .input,.select{
    background:#fffaf6;color:#111;
    border:1px solid rgba(255,106,0,.25);
    padding:12px 14px;
    border-radius:12px;font-weight:700;
    min-width:220px;
  }

  /* CATEGORÍAS */
  .group{margin:30px 0 36px}
  .group h2{
    font-weight:900;margin-bottom:14px;position:relative;
  }
  .group h2::after{
    content:"";width:72px;height:3px;
    background:linear-gradient(90deg,var(--accent),transparent);
    position:absolute;left:0;bottom:-6px;
  }

  /* GRID DE PRODUCTOS */
  .grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:18px;
  }
  .card{
    grid-column:span 12;background:#1a1a1c;
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;opacity:0;transform:translateY(10px);
    transition:.5s;
  }
  .card.in{opacity:1;transform:translateY(0)}
  .media{
    display:flex;justify-content:center;align-items:center;
    min-height:220px;background:#0f0f10;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .media img{
    width:100%;height:260px;object-fit:contain;background:white;
  }

  .body{padding:18px}
  .badge{
    background:rgba(255,106,0,.12);color:#ffd9c2;
    padding:6px 10px;border-radius:999px;
    display:inline-block;margin-bottom:8px;
    border:1px solid rgba(255,106,0,.25);
    font-weight:800;
  }
  .price{margin-top:10px;font-weight:900}
  .nostock{
    background:rgba(255,106,0,.14);
    padding:3px 8px;border-radius:8px;
    border:1px solid rgba(255,106,0,.3);
    color:#ffcf9e;
  }

  /* FOOTER */
  footer{
    border-top:1px solid rgba(255,255,255,.08);
    background:#0b0b0c;margin-top:auto;
    backdrop-filter:blur(6px);
  }
  .foot{
    display:flex;justify-content:space-between;
    align-items:center;padding:10px 40px;
  }
</style>

</head>
<body>

<div class="bg"></div>

<!-- ============================
   🔼 HEADER
============================= -->
<header>
  <nav class="nav">
    <a class="logo" href="index.html"><img src="assets/img/logo.jpg"><span class="brand">Power Lab</span></a>
    <button class="back" onclick="location.href='index.html#marcas'">Volver</button>
  </nav>
</header>

<!-- ============================
   🏷️ TÍTULO + PRESENTACIÓN
============================= -->
<main>
  <div class="title">
    <img src="assets/img/ena.jpg">
    <div>
      <h1>Catálogo · ENA</h1>
      <small>Elegí tu producto. Precios en ARS.</small>
    </div>
  </div>

  <!-- ============================
       🔍 FILTROS
  ============================= -->
  <div class="filters">
    <input id="q" class="input" placeholder="Buscar...">
    <select id="cat" class="select">
      <option value="todas">Todas las categorías</option>
      <option value="creatina">Creatina</option>
      <option value="proteina">Proteína</option>
      <option value="multi">Multivitamínico</option>
    </select>
    <select id="sort" class="select">
      <option value="rec">Orden recomendado</option>
      <option value="precioAsc">Menor precio</option>
      <option value="precioDesc">Mayor precio</option>
      <option value="az">A-Z</option>
    </select>
  </div>

  <!-- ============================
       🧱 CATEGORÍAS
  ============================= -->

  <section class="group" id="g-creatina">
    <h2>Creatina <span class="chip" id="c-creatina">0</span></h2>
    <div class="grid" data-cat="creatina"></div>
  </section>

  <section class="group" id="g-proteina">
    <h2>Proteína <span class="chip" id="c-proteina">0</span></h2>
    <div class="grid" data-cat="proteina"></div>
  </section>

  <section class="group" id="g-multi">
    <h2>Multivitamínico <span class="chip" id="c-multi">0</span></h2>
    <div class="grid" data-cat="multi"></div>
  </section>

</main>

<!-- ============================
   📞 FOOTER + WHATSAPP
============================= -->
<footer>
  <div class="foot">
    <small>© 2025 Power Lab. Todos los derechos reservados.</small>
  </div>
</footer>

<a href="https://wa.me/5491171484334" target="_blank" class="whatsapp-fab">
  <img src="assets/img/whatsapp.svg" width="36">
</a>

<!-- ============================
   🧠 SCRIPT · PRODUCTOS + RENDER
============================= -->
<script>
const IMG_BASE='assets/img/';

/* ============================
   📦 LISTA DE PRODUCTOS ENA
============================= */
const PRODUCTS=[
  {cat:'proteina', name:'ENA Whey Protein 1LB', price:58000, img:'Prote_500g.jpg', desc:'Excelente disolución.'},

  {cat:'proteina', name:'ENA Whey Protein 2LB', price:58000, img:'ena_Whey_Protein_2LB_vainilla_chocolate_frutilla_cookies_banana.jpg', desc:'Excelente disolución.'},
  
  /* ✔️ Agregado: creatina */
  {cat:'creatina', name:'ENA Creatina 300g', price:32000, img:'ena_Creatina_300g.jpg', desc:'Pura y micronizada.'},

  /* ✔️ Agregado: Multivitamínico ENA */
  {cat:'multi', name:'ENA Multivitamínico', price:null, img:'MultiVitaminico.jpg', desc:'Vitaminas y minerales esenciales.'}
];

/* ============================
   🔧 CONFIGURACIONES
============================= */
const q=document.getElementById('q');
const cat=document.getElementById('cat');
const sort=document.getElementById('sort');
const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.18});

const label=c=>({creatina:'Creatina',proteina:'Proteína',multi:'Multivitamínico'}[c]||c);
const pesos=v=>v.toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});

/* ============================
   🎴 Generador de tarjetas
============================= */
function card(p){
  const priceHtml=(p.price&&p.price>0)
    ? `<div class="price">${pesos(p.price)}</div>`
    : `<div class="price"><span class="nostock">Sin stock</span></div>`;

  const src=p.img.includes('http')?p.img:(IMG_BASE+p.img);

  const el=document.createElement('article');
  el.className='card';
  el.innerHTML=`
    <div class="media"><img src="${src}"></div>
    <div class="body">
      <span class="badge">${label(p.cat)}</span>
      <h3>${p.name}</h3>
      <p>${p.desc || ''}</p>
      ${priceHtml}
    </div>
  `;
  io.observe(el);
  return el;
}

/* ============================
   🧩 Renderizado principal
============================= */
function render(){
  document.querySelectorAll('.grid').forEach(g=>g.innerHTML='');

  const term=(q.value||'').trim().toLowerCase();
  const catVal=cat.value;

  let data=PRODUCTS.filter(p=>{
    const matchCat=(catVal==='todas' || p.cat===catVal);
    const matchText=!term || p.name.toLowerCase().includes(term);
    return matchCat && matchText;
  });

  if(sort.value==='precioAsc')data.sort((a,b)=>(a.price||999999)-(b.price||999999));
  if(sort.value==='precioDesc')data.sort((a,b)=>(b.price||0)-(a.price||0));
  if(sort.value==='az')data.sort((a,b)=>a.name.localeCompare(b.name));

  const counts={creatina:0,proteina:0,multi:0};
  data.forEach(p=>counts[p.cat]++);

  for(const k in counts){
    document.getElementById('c-'+k).textContent=counts[k];
    document.getElementById('g-'+k).style.display = counts[k] ? '' : 'none';
  }

  data.forEach(p=>{
    const grid=document.querySelector(`.grid[data-cat="${p.cat}"]`);
    grid.appendChild(card(p));
  });
}

q.addEventListener('input',render);
cat.addEventListener('change',render);
sort.addEventListener('change',render);
render();
</script>

</body>
</html>
