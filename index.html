<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protein Power Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0e0e0f;
      --card:#f0f0f0;
      --text:#111;
      --accent:#FF6A00;
      --radius:18px;
      --shadow:0 20px 60px rgba(0,0,0,.55);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);}

    .bg {
      position:fixed;inset:0;z-index:-2;
      background:url("assets/img/bg-texture.jpg") center/cover no-repeat;
      filter:contrast(1.05) brightness(.9);
    }
    .bg::after {
      content:"";position:absolute;inset:0;
      background:radial-gradient(1200px 600px at 50% 0, rgba(255,106,0,.2), transparent 60%);
    }

    header {
      position:sticky;top:0;z-index:10;
      background:rgba(14,14,15,.6);backdrop-filter:blur(6px);
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .nav {
      max-width:1200px;margin:0 auto;
      display:flex;align-items:center;gap:20px;
      padding:14px 20px;
    }
    .logo {display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
    .logo img{height:48px;width:48px;object-fit:cover;border-radius:10px}
    .brand{font-weight:800}

    .pill{margin-left:auto;padding:8px 14px;border-radius:999px;
      background:rgba(255,255,255,.1);color:#eee;font-size:.9rem}

    .hero {
      max-width:1200px;margin:60px auto;text-align:center;padding:0 20px;
    }
    .hero h1 {font-size:2.8rem;font-weight:800;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6)}
    .hero p {color:#ccc;margin-top:12px}

    .brands {
      max-width:1200px;margin:50px auto;padding:0 20px;
      display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;
    }
    .brand-card {
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:20px;background:var(--card);border-radius:var(--radius);
      box-shadow:var(--shadow);text-decoration:none;color:var(--text);
    }
    .brand-card img {width:200px;object-fit:contain;margin-bottom:12px}
    .brand-card small {margin-top:auto;font-weight:700;font-size:.95rem}

    footer {
      background:#000;color:#ccc;margin-top:50px;
    }
    .foot {
      max-width:1200px;margin:0 auto;
      padding:20px;display:flex;justify-content:space-between;align-items:center;
    }
    .social {display:flex;gap:14px}
    .social img {width:34px;height:34px;object-fit:cover;border-radius:6px}

    /* WhatsApp flotante */
    .whatsapp-float {
      position:fixed;bottom:20px;right:20px;z-index:50;
    }
    .whatsapp-float img {
      width:60px;height:60px;border-radius:50%;
      box-shadow:0 4px 15px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <header>
    <nav class="nav">
      <a href="index.html" class="logo">
        <img src="assets/img/logo.jpg" alt="Logo">
        <span class="brand">Protein Power Lab</span>
      </a>
      <span class="pill">Envíos 24–72 h</span>
    </nav>
  </header>

  <section class="hero">
    <h1>Tu fuente de fuerza, poder y <span style="color:var(--accent)">resultados reales</span></h1>
    <p>Suplementos de marcas confiables y precios competitivos. Comprá fácil y rápido.</p>
  </section>

  <section class="brands">
    <a class="brand-card" href="star.html">
      <img src="assets/img/star.jpg" alt="Star Nutrition">
      <small>Ver catálogo</small>
    </a>
    <a class="brand-card" href="ena.html">
      <img src="assets/img/ena.jpg" alt="ENA">
      <small>Ver catálogo</small>
    </a>
    <a class="brand-card" href="dymatize.html">
      <img src="assets/img/dymatize.jpg" alt="Dymatize">
      <small>Ver catálogo</small>
    </a>
  </section>

  <footer>
    <div class="foot">
      <small>© 2025 Protein Power Lab. Todos los derechos reservados.</small>
      <small>Contacto: proteinpowerlab@gmail.com</small>
      <div class="social">
        <a href="https://www.instagram.com/protein_power_lab" target="_blank">
          <img src="assets/img/instagram.jpg" alt="Instagram">
        </a>
        <a href="https://facebook.com" target="_blank">
          <img src="assets/img/facebook.jpg" alt="Facebook">
        </a>
        <a href="mailto:proteinpowerlab@gmail.com">
          <img src="assets/img/gmail.jpg" alt="Gmail">
        </a>
      </div>
    </div>
  </footer>

  <!-- WhatsApp flotante -->
  <a href="https://wa.me/541123014207" class="whatsapp-float" target="_blank">
    <img src="assets/img/whatsapp.jpg" alt="WhatsApp">
  </a>
</body>
</html>
