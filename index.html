<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protein Power Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0e0e0f;
      --card:#f2f2f2; /* gris hueso claro */
      --muted:#cfcfcf;
      --text:#f3f3f3;
      --accent:#FF6A00;
      --radius:18px;
      --shadow:0 20px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    .bg{position:fixed;inset:0;z-index:-2;
      background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
      filter:contrast(1.02) brightness(.85);}
    .bg::after{content:"";position:absolute;inset:0;z-index:-1;
      background:radial-gradient(1200px 600px at 50% 0, rgba(255,106,0,.18), transparent 60%),
                 radial-gradient(1200px 600px at 50% 100%, rgba(255,255,255,.12), transparent 60%),
                 linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.6));}

    header{position:sticky;top:0;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);}
    .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 20px}
    .logo{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
    .logo img{height:46px;width:46px;border-radius:10px;object-fit:cover;background:#000}
    .brand{font-weight:800;}

    .hero{text-align:center;max-width:900px;margin:60px auto;padding:0 20px}
    .hero h1{font-size:2.6rem;font-weight:800;line-height:1.1}
    .hero p{color:var(--muted);margin-top:10px}

    .brands{max-width:1200px;margin:40px auto;padding:0 20px}
    .brand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
    .brand-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;color:#111;transition:.2s}
    .brand-card:hover{transform:translateY(-3px)}
    .brand-card img{width:clamp(120px,40vw,240px);object-fit:contain}
    .brand-card h3{margin-top:12px;font-weight:800;color:#111}

    /* WhatsApp flotante */
    .whatsapp-float{position:fixed;bottom:22px;right:22px;z-index:99}
    .whatsapp-float img{width:62px;height:62px;object-fit:contain}

    footer{border-top:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.85);}
    .foot{max-width:1200px;margin:0 auto;padding:28px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
    .foot small{color:#b5b5b5}
    .socials{display:flex;gap:14px}
    .socials img{width:40px;height:40px;object-fit:contain}
  </style>
</head>
<body>
  <div class="bg"></div>

  <header>
    <nav class="nav">
      <a class="logo" href="index.html">
        <img src="assets/img/logo.jpg" alt="Protein Power Lab">
        <span class="brand">Protein Power Lab</span>
      </a>
    </nav>
  </header>

  <section class="hero">
    <h1>Tu fuente de fuerza, poder y <span style="color:var(--accent)">resultados reales</span></h1>
    <p>Suplementos de marcas confiables y precios competitivos. Envíos en CABA y GBA.</p>
  </section>

  <section class="brands">
    <div class="brand-grid">
      <a class="brand-card" href="star.html">
        <img src="assets/img/star.jpg" alt="Star Nutrition">
        <h3>Star Nutrition</h3>
      </a>
      <a class="brand-card" href="ena.html">
        <img src="assets/img/ena.jpg" alt="ENA">
        <h3>ENA</h3>
      </a>
      <a class="brand-card" href="dimatize.html">
        <img src="assets/img/dimatize.jpg" alt="Dimatize">
        <h3>Dimatize</h3>
      </a>
    </div>
  </section>

  <!-- Botón flotante de WhatsApp -->
  <a class="whatsapp-float" href="https://wa.me/541123014207" target="_blank">
    <img src="assets/img/whatsapp.jpg" alt="WhatsApp">
  </a>

  <footer>
    <div class="foot">
      <small>© 2025 Protein Power Lab. Todos los derechos reservados.</small>
      <div class="socials">
        <a href="https://www.instagram.com/protein_power_lab" target="_blank">
          <img src="assets/img/instagram.jpg" alt="Instagram">
        </a>
        <a href="https://www.facebook.com" target="_blank">
          <img src="assets/img/facebook.jpg" alt="Facebook">
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
