<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Power Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0e0e0f;
      --card: rgba(240,240,240,0.7);
      --muted:#cfcfcf;
      --text:#f3f3f3;
      --accent:#FF6A00;
      --radius:18px;
      --shadow:0 20px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Montserrat',sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .bg{position:fixed;inset:0;z-index:-2;
      background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
      filter:contrast(1.02) brightness(.8);
    }

    /* HEADER */
    header{
      position:sticky;top:0;z-index:50;
      background:rgba(14,14,15,.6);
      backdrop-filter:blur(6px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .nav{
      width:100%;
      display:flex;align-items:center;
      padding:14px 40px;
    }
    .logo{
      display:flex;align-items:center;gap:14px;
      text-decoration:none;color:#fff;
      margin-right:auto;
    }
    .logo img{height:50px;width:50px;object-fit:contain}
    .brand{font-weight:800}
    .pill{
      margin-left:auto;
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.1);
      font-size:.9rem;color:var(--muted);
    }

    /* HERO */
    .hero{max-width:1200px;margin:48px auto 0;
      padding:0 20px 28px;text-align:center}
    .hero h1{font-size:clamp(2.4rem,4vw,3.6rem);font-weight:800;line-height:1.1}
    .hero p{color:var(--muted);margin-top:12px}

    /* MARCAS */
    .brands{max-width:1200px;margin:36px auto 90px;padding:0 20px}
    .brand-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
    .brand-card{display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:12px;padding:24px;background:var(--card);
      border-radius:var(--radius);box-shadow:var(--shadow);
      text-decoration:none;color:#111;transition:.2s}
    .brand-card:hover{transform:translateY(-2px)}
    .brand-card .brand-logo{width:clamp(140px,40vw,220px);height:100px;object-fit:contain;display:block;}
    .brand-card small{font-weight:600;color:#333}
    /* Dymatize: igualar tono con Star y ENA */
.brand-card.brand--dymatize .brand-logo{
  filter: grayscale(1) brightness(0) contrast(120%);
  height:100px;
  max-width:220px;
  opacity:0.85;   /* 👈 un poquito más transparente */
}


    /* FOOTER */
    footer{
      border-top:1px solid rgba(255,255,255,.08);
      background:rgba(10,10,10,.9);
      backdrop-filter:blur(6px);
      margin-top:auto;
    }
    .foot{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:28px 40px;
    }
    .foot small{margin-left:0;color:#b5b5b5}
    .socials{
      display:flex;gap:12px;
      margin-left:auto;margin-right:100px;
    }
    .socials a{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:8px}
    .socials a.facebook { background:#1877F2; }
    .socials a.facebook svg { fill:#fff; width:24px; height:24px; }
    .socials a.instagram {
      background: radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);
    }
    .socials a.instagram svg { fill:#fff; width:24px; height:24px; }

    /* WHATSAPP */
    .whatsapp-fab {
      position: fixed; right: 18px; bottom: 18px; z-index: 9999;
      width: 68px; height: 68px; border-radius: 50%;
      background: #25D366;
      box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 -2px 0 rgba(0,0,0,.08);
      display: grid; place-items: center;
      text-decoration: none; transition: transform .15s ease;
    }
    .whatsapp-fab:hover {transform: translateY(-2px);}
    .whatsapp-fab svg {width: 36px; height: 36px;fill: #fff;display: block;}

    /* ===== MOBILE FIX ===== */
    @media (max-width: 680px){
      .nav{padding:12px}
      .logo img{height:42px;width:42px}
      .brand{font-size:.95rem}
      .pill{padding:8px 10px;font-size:.8rem}
      .hero{margin:24px auto 0;padding:0 14px 18px}
      .brands{margin:22px auto 96px;padding:0 14px}
      .brand-grid{grid-template-columns:1fr;gap:16px}
      .brand-card{padding:18px;border-radius:16px}
      .brand-card .brand-logo{height:78px}
      .foot{padding:16px 12px}
      .socials{margin-right:72px;gap:10px}
    }

    html { -webkit-text-size-adjust: 100%; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- HEADER -->
  <header>
    <nav class="nav">
      <a class="logo" href="index.html">
        <img src="assets/img/logo.jpg" alt="">
        <span class="brand">Protein Power Lab</span>

      <span class="pill">Envíos en 24–72 h</span>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Tu fuente de fuerza, poder y <span style="color:var(--accent)">resultados reales</span></h1>
    <p>Suplementos de marcas confiables y precios competitivos.</p>
  </section>

  <!-- MARCAS -->
  <section class="brands">
    <div class="brand-grid">
      <a class="brand-card" href="star.html">
        <img class="brand-logo" src="assets/img/star.jpg" alt="Star Nutrition">

      <a class="brand-card" href="ena.html">
        <img class="brand-logo" src="assets/img/ena.jpg" alt="ENA">

      <a class="brand-card brand--dymatize" href="dymatize.html">

        <small>Ver catálogo</small>
      </a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="foot">
      <small>© 2025 Protein Power Lab. Todos los derechos reservados.

          <svg viewBox="0 0 24 24"><path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm10 2c1.7 0 3 1.3 3 3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 1.3-3 3-3h10zm-5 3a5 5 0 1 0 .1 10.1A5 5 0 0 0 12 7zm0 2a3 3 0 1 1-.1 6.1A3 3 0 0 1 12 9zm4.8-3.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2z"/></svg>

</body>
</html>
