<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protein Power Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0e0e0f;
      --card:#ffffff;
      --muted:#cfcfcf;
      --text:#f3f3f3;
      --accent:#FF6A00;
      --radius:18px;
      --shadow:0 20px 60px rgba(0,0,0,.55);
      --bonewhite:#f8f8f8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    .bg{
      position:fixed;inset:0;z-index:-2;
      background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
      filter:contrast(1.02) brightness(.9);
    }

    header{position:sticky;top:0;z-index:50;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 20px}
    .logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
    .logo img{height:48px;width:48px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.1);background:#000}
    .brand{font-weight:800;letter-spacing:.4px}
    .pill{margin-left:auto;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:.9rem;color:var(--muted)}

    .hero{max-width:1200px;margin:48px auto 0;padding:0 20px 28px;display:grid;gap:24px;text-align:center}
    .hero h1{font-size:clamp(2.2rem, 4vw, 3.4rem);font-weight:800;line-height:1.1;text-shadow:0 6px 30px rgba(0,0,0,.5)}
    .hero p{color:var(--muted);max-width:70ch;margin:0 auto}

    .brands{max-width:1200px;margin:36px auto 90px;padding:0 20px}
    .brand-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
    @media(max-width:768px){.brand-grid{grid-template-columns:1fr}}
    .brand-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;padding:24px;background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;color:#111;transition:transform .2s, box-shadow .2s}
    .brand-card:hover{transform:translateY(-2px);box-shadow:0 24px 50px rgba(0,0,0,.25)}
    .brand-card .brand-logo{width:clamp(140px,40vw,260px);object-fit:contain;filter:brightness(0) saturate(100%) invert(100%) sepia(4%) saturate(180%) hue-rotate(10deg) brightness(98%) contrast(90%);}
    .brand-card h3{margin-top:8px;font-size:1.1rem;font-weight:800;color:#111}
    .brand-card small{color:#555;font-weight:600}

    footer{border-top:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.85);backdrop-filter:blur(6px)}
    .foot{max-width:1200px;margin:0 auto;padding:32px 20px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
    .foot img{width:42px;height:42px;object-fit:contain;transition:transform .2s}
    .foot img:hover{transform:scale(1.15)}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <nav class="nav">
      <a class="logo" href="index.html"><img src="assets/img/logo.jpg" alt="Logo"><span class="brand">Protein Power Lab</span></a>
      <span class="pill">Envíos en 24–72 h</span>
    </nav>
  </header>

  <section class="hero">
    <h1>Tu fuente de fuerza, poder y <span style="color:var(--accent)">resultados reales</span></h1>
    <p>Suplementos de marcas confiables y precios competitivos. Comprá fácil y rápido, con entregas en CABA/GBA.</p>
  </section>

  <section class="brands" id="marcas">
    <div class="brand-grid">
      <a class="brand-card" href="star.html">
        <img class="brand-logo" src="assets/img/star.jpg" alt="Star Nutrition" />
        <h3>Star Nutrition</h3>
        <small>Ver catálogo</small>
      </a>
      <a class="brand-card" href="ena.html">
        <img class="brand-logo" src="assets/img/ena.jpg" alt="ENA" />
        <h3>ENA</h3>
        <small>Ver catálogo</small>
      </a>
    </div>
  </section>

  <footer>
    <div class="foot">
      <a href="https://wa.me/541123014207" target="_blank">
        <img src="assets/img/logo-whatsapp.jpg" alt="WhatsApp">
      </a>
      <a href="https://www.instagram.com/protein_power_lab" target="_blank">
        <img src="assets/img/logo-instagram.jpg" alt="Instagram">
      </a>
      <a href="https://www.facebook.com/ProteinPowerLab" target="_blank">
        <img src="assets/img/logo-facebook.jpg" alt="Facebook">
      </a>
    </div>
  </footer>
</body>
</html>
