<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Power Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* === ESTILOS GENERALES ==================================== */
    :root{
      --bg:#0e0e0f;
      --card:#f0f0f0;
      --muted:#cfcfcf;
      --text:#f3f3f3;
      --accent:#FF6A00;
      --radius:18px;
      --shadow:0 20px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    .bg{
      position:fixed;inset:0;z-index:-2;
      background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
      filter:contrast(1.02) brightness(.8);
    }

    header{position:sticky;top:0;z-index:50;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 20px}
    .logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
    .logo img{height:50px;width:50px;object-fit:contain}
    .brand{font-weight:800}

    .pill{margin-left:auto;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:.9rem;color:var(--muted)}

    .hero{max-width:1200px;margin:48px auto 0;padding:0 20px 28px;text-align:center}
    .hero h1{font-size:clamp(2.4rem,4vw,3.6rem);font-weight:800;line-height:1.1}
    .hero p{color:var(--muted);margin-top:12px}

    /* === GRID DE MARCAS ====================================== */
    .brands{max-width:1200px;margin:36px auto 90px;padding:0 20px}
    .brand-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
    .brand-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;color:#111;transition:.2s}
    .brand-card:hover{transform:translateY(-2px)}
    .brand-card .brand-logo{
      width:clamp(140px,40vw,220px);
      height:100px;                      /* === alinear logos === */
      object-fit:contain;
      display:block;
    }
    .brand-card small{font-weight:600;color:#333}

    /* === FOOTER ============================================== */
    footer{border-top:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.9);backdrop-filter:blur(6px);margin-top:40px}
    .foot{max-width:1200px;margin:0 auto;padding:28px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
    .foot small{color:#b5b5b5}

    .socials{display:flex;gap:12px}
    .socials a{
      width:46px;height:46px;display:flex;align-items:center;justify-content:center;
      background:#333;border-radius:50%;    /* === redondeado === */
    }
    .socials a img{width:26px;height:26px;object-fit:contain}

    /* === WHATSAPP FLOTANTE ================================== */
    .whatsapp-fab{
      position:fixed;right:18px;bottom:18px;z-index:9999;
      width:68px;height:68px;border-radius:50%;
      background:#25D366;display:grid;place-items:center;
      box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 -2px 0 rgba(0,0,0,.08);
      text-decoration:none;transition:transform .15s ease;
    }
    .whatsapp-fab:hover{transform:translateY(-2px)}
    .whatsapp-fab svg{width:36px;height:36px;fill:#fff}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <nav class="nav">
      <a class="logo" href="index.html"><img src="assets/img/logo.jpg" alt=""><span class="brand">Protein Power Lab</span></a>
      <span class="pill">Envíos en 24–72 h</span>
    </nav>
  </header>

  <section class="hero">
    <h1>Tu fuente de fuerza, poder y <span style="color:var(--accent)">resultados reales</span></h1>
    <p>Suplementos de marcas confiables y precios competitivos.</p>
  </section>

  <section class="brands">
    <div class="brand-grid">
      <a class="brand-card" href="star.html">
        <img class="brand-logo" src="assets/img/star.jpg" alt="Star Nutrition">
        <small>Ver catálogo</small>
      </a>
      <a class="brand-card" href="ena.html">
        <img class="brand-logo" src="assets/img/ena.jpg" alt="ENA">
        <small>Ver catálogo</small>
      </a>
      <a class="brand-card" href="dymatize.html">
        <img class="brand-logo" src="assets/img/dymatize.jpg" alt="Dymatize">
        <small>Ver catálogo</small>
      </a>
    </div>
  </section>

  <footer>
    <div class="foot">
      <small>© 2025 Protein Power Lab. Todos los derechos reservados. · Contacto: proteinpowerlab@gmail.com</small>
      <div class="socials">
        <a href="https://www.facebook.com/" target="_blank"><img src="assets/img/facebook.jpg" alt="Facebook"></a>
        <a href="https://www.instagram.com/protein_power_lab" target="_blank"><img src="assets/img/instagram.jpg" alt="Instagram"></a>
      </div>
    </div>
  </footer>

  <!-- WhatsApp flotante -->
  <a class="whatsapp-fab" href="https://wa.me/541123014207?text=Hola%20Protein%20Power%20Lab!" target="_blank" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32"><path d="M16 .5C7.6.5.5 7.6.5 16c0 2.8.7 5.5 2 7.9L.6 31.5l7-1.8c2.3 1.3 5 2 7.9 2 8.4 0 15.5-7.1 15.5-15.5S24.4.5 16 .5zm0 28.3c-2.4 0-4.7-.6-6.7-1.8l-.5-.3-4.1 1 1.1-4-.3-.5c-1.2-2-1.8-4.3-1.8-6.7 0-7 5.7-12.7 12.7-12.7S28.7 9 28.7 16c0 7-5.7 12.8-12.7 12.8z"/><path d="M23.5 19.4c-.4-.2-2.3-1.1-2.6-1.2-.4-.1-.6-.2-.9.2-.2.4-1 1.2-1.2 1.4-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.3-2-1.2-1-2-2.3-2.2-2.7-.2-.4 0-.6.1-.8.1-.1.2-.3.3-.5.1-.1.1-.2.2-.4.1-.2.1-.4 0-.6-.1-.2-.9-2.1-1.2-2.9-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 3s1.2 3.5 1.4 3.7c.2.3 2.3 3.6 5.6 5 3.3 1.4 3.9 1.1 4.6 1 .7-.1 2.3-1 2.6-1.9.3-.9.3-1.6.2-1.8-.1-.2-.3-.3-.7-.5z"/></svg>
  </a>
</body>
</html>
