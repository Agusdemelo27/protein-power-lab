<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Protein Power Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0f0f10;
      --text:#f3f3f3;
      --muted:#cfcfcf;
      --accent:#FF6A00;
      --card:#efe7dd;              /* “hueso” */
      --radius:18px;
      --shadow:0 18px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    /* Fondo como antes: textura + glow naranja */
    .bg{
      position:fixed;inset:0;z-index:-2;
      background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
      filter:brightness(.85) contrast(1.03);
    }
    .bg::after{
      content:"";position:absolute;inset:0;z-index:-1;
      background:
        radial-gradient(900px 420px at 50% 15%, rgba(255,106,0,.20), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.65));
    }

    header{position:sticky;top:0;z-index:10;background:rgba(15,15,16,.55);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
    .nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 20px}
    .brand{font-weight:800;letter-spacing:.3px}

    .hero{max-width:1200px;margin:34px auto 0;padding:0 20px 8px;text-align:center}
    .hero h1{font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.1;font-weight:800;text-shadow:0 8px 34px rgba(0,0,0,.55)}
    .hero .accent{color:var(--accent)}
    .hero p{margin-top:10px;color:var(--muted)}

    /* Marcas */
    .brands{max-width:1200px;margin:28px auto 80px;padding:0 20px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .card{
      display:block;text-decoration:none;color:#111;background:var(--card);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 18px;
      transition:transform .18s ease, box-shadow .18s ease; text-align:center;
    }
    .card:hover{transform:translateY(-2px);box-shadow:0 24px 60px rgba(0,0,0,.36)}
    .card img{display:block;margin:8px auto 14px;max-width:240px;width:100%;height:80px;object-fit:contain;filter:grayscale(100%) brightness(.13)}
    .card h3{font-weight:800;margin-bottom:4px}
    .card small{color:#444;font-weight:700;text-decoration:underline}

    footer{border-top:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.82);backdrop-filter:blur(6px)}
    .foot{max-width:1200px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;padding:18px 20px;flex-wrap:wrap}
    .foot small{color:#bdbdbd}
    .social{display:flex;align-items:center;gap:12px}
