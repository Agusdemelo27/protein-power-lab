<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Catálogo · Star Nutrition</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0a0a0a; --bg-2:#121212; --muted:#c7c7c7;
      --brand:#ff6a00; --brand-2:#ffb347;
      --radius:18px; --shadow:0 18px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#fff}

    .bg{position:fixed;inset:0;z-index:-2;background:url('assets/img/bg-texture.jpg') center/cover no-repeat;filter:contrast(1.03) brightness(.72)}
    .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(1200px 600px at 50% 0, rgba(255,106,0,.20), transparent 60%),radial-gradient(1200px 600px at 50% 100%, rgba(255,179,71,.16), transparent 60%),linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.7))}

    header{position:sticky;top:0;z-index:10;background:rgba(12,12,12,.7);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center}
    .back{margin-left:auto}
    .btn{
      display:inline-flex;align-items:center;gap:10px;
      background:linear-gradient(180deg,var(--brand),#e05500);
      color:#fff;text-decoration:none;font-weight:700;
      padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
      box-shadow:0 10px 22px rgba(255,106,0,.25);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 14px 32px rgba(255,106,0,.35)}

    .wrap{max-width:1200px;margin:28px auto 80px;padding:0 20px}
    .title{display:flex;align-items:center;gap:14px;margin-bottom:8px}
    .logo{
      width:56px;height:56px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden
    }
    .logo img{width:100%;height:100%;object-fit:contain; mix-blend-mode:multiply}
    .subtitle{color:var(--muted);margin-bottom:18px}

    /* filtros */
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 22px}
    .input, .select{
      background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
      border-radius:12px; color:#fff; padding:10px 12px; outline:none
    }
    .input{min-width:260px}
    .select{min-width:180px}

    /* grid productos */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:680px){.grid{grid-template-columns:1fr}}

    .card{
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.10);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden; display:flex; flex-direction:column;
    }
    .figure{
      position:relative; height:220px; background:#0f0f0f;
      border-bottom:1px solid rgba(255,255,255,.06);
      display:grid;place-items:center;
    }
    .badge{
      position:absolute; top:12px; left:12px;
      font-size:.8rem; padding:6px 10px; border-radius:999px;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12)
    }
    .figure img{
      max-width:80%; max-height:80%; object-fit:contain;
      mix-blend-mode:multiply;
    }
    .body{padding:16px}
    .name{font-weight:800; margin-bottom:6px}
    .desc{color:#d9d9d9; font-size:.96rem}
    .price{margin-top:12px; font-weight:800}
    .nostock{color:#ffb347; font-weight:800}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <div class="nav">
      <div class="title">
        <div class="logo"><img src="assets/img/star.jpg" alt="Star"></div>
        <h1>Catálogo · Star Nutrition</h1>
      </div>
      <a class="btn back" href="index.html">← Volver</a>
    </div>
  </header>

  <main class="wrap">
    <p class="subtitle">Elegí tu producto. Los sabores están aclarados entre paréntesis. Precios en ARS.</p>

    <!-- Filtros -->
    <div class="toolbar">
      <input id="q" class="input" type="search" placeholder="Buscar producto... (ej: creatina, whey, pump)">
      <select id="cat" class="select">
        <option value="">Todas las categorías</option>
        <option value="Creatina">Creatina</option>
        <option value="Proteína">Proteína</option>
        <option value="Pre-entreno">Pre-entreno</option>
        <option value="Multivitamínico">Multivitamínico</option>
        <option value="Aminoácidos">Aminoácidos</option>
      </select>
      <select id="ord" class="select">
        <option value="default">Orden: recomendado</option>
        <option value="precio_asc">Precio: menor a mayor</option>
        <option value="precio_desc">Precio: mayor a menor</option>
        <option value="nombre_asc">Nombre: A → Z</option>
      </select>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <script>
  // ====== DATA STAR (con precios y “Sin stock” si falta) ======
  const STAR = [
    // Creatina
    {cat:'Creatina', name:'Creatina 150g', img:'assets/img/creatina150g.jpg', desc:'Pura y micronizada.', price:20000},
    {cat:'Creatina', name:'Creatina 300g (doypack)', img:'assets/img/creatina300g_doypack.jpg', desc:'Pura y micronizada.', price:33990},
    {cat:'Creatina', name:'Creatina 300g (pote)', img:'assets/img/creatina300g_pote.jpg', desc:'Pura y micronizada.', price:35000},
    {cat:'Creatina', name:'Creatina 500g', img:'assets/img/creatina500g.jpg', desc:'Pura y micronizada.', price:52000},
    {cat:'Creatina', name:'Creatina 1kg', img:'assets/img/creatina1kg.jpg', desc:'Pura y micronizada.', price:89000},

    // Proteína Whey
    {cat:'Proteína', name:'Whey Protein 2LB (vainilla, chocolate, frutilla, cookies, banana)', img:'assets/img/whey2lb.jpg', desc:'Excelente disolución.', price:40000},

    // Pre-entreno
    {cat:'Pre-entreno', name:'Pump V8 285g (acai, lima limón, grape, watermelon)', img:'assets/img/pump_v8_285.jpg', desc:'Energía y enfoque para tu sesión.', price:34000},
    {cat:'Pre-entreno', name:'Pump 3D Ripped 315g (lemon, strawberry lemon)', img:'assets/img/pump3d_315.jpg', desc:'Termogénico con enfoque.', price:null}, // sin stock

    // Aminoácidos (si no tenés foto, dejá un jpg genérico o se verá “sin foto”)
    {cat:'Aminoácidos', name:'BCAA', img:'assets/img/bcaa.jpg', desc:'Recuperación muscular.', price:30000},
    {cat:'Aminoácidos', name:'EAA Essential Amino 360g', img:'assets/img/eaa360.jpg', desc:'Perfil completo de aminoácidos.', price:34000},

    // Multivitamínicos & otros
    {cat:'Multivitamínico', name:'All in One Vitamin 60caps', img:'assets/img/allinone_60caps.jpg', desc:'Vitaminas y minerales clave.', price:30000},
    {cat:'Multivitamínico', name:'Magnesio sin sabor 60caps', img:'assets/img/magnesio_60caps.jpg', desc:'Soporte muscular y nervioso.', price:15500},
    {cat:'Multivitamínico', name:'Cafeína 200 x 30 caps', img:'assets/img/cafeina_200x30.jpg', desc:'Energía y foco.', price:33990},
    {cat:'Multivitamínico', name:'Omega-3 60caps', img:'assets/img/omega3_60caps.jpg', desc:'EPA/DHA calidad premium.', price:32000},
  ];

  // ====== Render ======
  const $grid = document.getElementById('grid');
  const $q = document.getElementById('q');
  const $cat = document.getElementById('cat');
  const $ord = document.getElementById('ord');

  function money(v){
    if(v==null) return '<span class="nostock">Sin stock</span>';
    return '$ ' + v.toLocaleString('es-AR');
  }

  function card(p){
    const noImg = !p.img;
    return `
      <article class="card">
        <figure class="figure">
          <span class="badge">${p.cat}</span>
          ${noImg ? '<small style="opacity:.7">Sin foto</small>' : `<img src="${p.img}" alt="${p.name}">`}
        </figure>
        <div class="body">
          <h3 class="name">${p.name}</h3>
          <p class="desc">${p.desc||''}</p>
          <div class="price">${money(p.price)}</div>
        </div>
      </article>
    `;
  }

  function apply(){
    const q = ($q.value||'').toLowerCase();
    const cat = $cat.value;
    const ord = $ord.value;

    let list = STAR.filter(p=>{
      const okCat = !cat || p.cat===cat;
      const okQ = !q || (p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));
      return okCat && okQ;
    });

    switch(ord){
      case 'precio_asc':
        list.sort((a,b)=> (a.price??Infinity) - (b.price??Infinity)); break;
      case 'precio_desc':
        list.sort((a,b)=> (b.price??-Infinity) - (a.price??-Infinity)); break;
      case 'nombre_asc':
        list.sort((a,b)=> a.name.localeCompare(b.name)); break;
      default:
        // Orden recomendado: categoría + nombre
        const order = ['Creatina','Proteína','Pre-entreno','Multivitamínico','Aminoácidos'];
        list.sort((a,b)=>{
          const ca = order.indexOf(a.cat), cb = order.indexOf(b.cat);
          return ca===cb ? a.name.localeCompare(b.name) : ca-cb;
        });
    }

    $grid.innerHTML = list.map(card).join('');
  }

  [$q,$cat,$ord].forEach(el=> el.addEventListener('input',apply));
  apply();
  </script>
</body>
</html>
