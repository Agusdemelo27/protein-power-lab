<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Star Nutrition</title>

<!-- ===========================
      TIPOGRAFÍA
=========================== -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- ===========================
      ESTILOS GENERALES
=========================== -->
<style>
  :root{
    --bg:#0e0e0f; --muted:#cfcfcf; --text:#f3f3f3;
    --accent:#FF6A00; --radius:16px; --shadow:0 20px 60px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Montserrat',system-ui;
    background:var(--bg);color:var(--text);
    overflow-x:hidden;min-height:100vh;
    display:flex;flex-direction:column;
  }

  .bg{
    position:fixed;inset:0;z-index:-2;
    background:url('assets/img/bg-texture.jpg') center/cover no-repeat;
    filter:contrast(1.02) brightness(.82);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(1100px 520px at 50% 0, rgba(255,106,0,.16), transparent 60%),
               linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.6));
  }

  /* ===========================
        HEADER
  =========================== */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(14,14,15,.6);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .nav{
    display:flex;align-items:center;gap:12px;
    padding:12px 20px;
  }
  .logo{
    display:flex;align-items:center;gap:12px;
    text-decoration:none;color:#fff;margin-right:auto;
  }
  .logo img{
    height:40px;width:40px;border-radius:10px;object-fit:cover;
    border:1px solid rgba(255,255,255,.1);background:#000;
  }
  .brand{font-weight:800}
  .right .back{
    background:var(--accent);color:#111;font-weight:800;
    border:none;border-radius:999px;padding:8px 14px;
    cursor:pointer;box-shadow:0 6px 18px rgba(255,106,0,.3);
  }

  /* ===========================
        CONTENIDO PRINCIPAL
  =========================== */
  main{
    max-width:1200px;margin:26px auto 80px;
    padding:0 20px;
  }

  .title{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .title img{width:42px;height:42px;object-fit:contain}
  .title h1{font-size:2rem;font-weight:800}

  /* ===========================
        FILTROS
  =========================== */
  .filters{
    display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 14px;
  }
  .input,.select{
    background:#fffaf6;color:#111;
    border:1px solid rgba(255,106,0,.25);
    border-radius:12px;font-weight:700;
    padding:12px 14px;min-width:220px;
  }

  /* ===========================
        GRUPOS Y GRID
  =========================== */
  .group{margin:30px 0}
  .group h2{
    margin-bottom:14px;font-size:1.4rem;font-weight:900;position:relative;
  }
  .group h2::after{
    content:"";position:absolute;left:0;bottom:-6px;
    width:72px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),transparent);
  }

  .grid{
    display:grid;grid-template-columns:repeat(12,1fr);gap:18px;
  }

  .card{
    grid-column:span 12;
    background:rgba(25,25,26,.9);
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    transform:translateY(10px);opacity:0;
    transition:transform .5s,opacity .5s;
  }
  .card.in{transform:translateY(0);opacity:1}

  /* ===========================
        TARJETA PRODUCTO
  =========================== */
  .media{
    display:flex;align-items:center;justify-content:center;
    background:#0f0f10;border-bottom:1px solid rgba(255,255,255,.06);
    min-height:220px;
  }
  .media img{
    width:100%;height:240px;object-fit:contain;background:#fff;
  }
  .body{padding:18px}
  .body h3{margin:4px 0 8px;font-size:1.1rem;font-weight:800}
  .body p{color:#dcdcdc;font-size:.95rem}
  .price{margin-top:10px;font-weight:900}
  .nostock{
    color:#ffcf9e;background:rgba(255,106,0,.14);
    padding:4px 8px;border-radius:8px;
  }

  /* ===========================
        FOOTER
  =========================== */
  footer{
    background:rgba(10,10,10,.9);
    backdrop-filter:blur(6px);
    border-top:1px solid rgba(255,255,255,.08);
    margin-top:auto;
  }
  .foot{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 30px;
  }
  .socials{display:flex;gap:12px}

  /* ===========================
        WHATSAPP BUTTON
  =========================== */
  .whatsapp-fab{
    position:fixed;right:18px;bottom:18px;z-index:999;
    width:68px;height:68px;border-radius:50%;
    background:#25D366;display:grid;place-items:center;
  }
</style>
</head>




<body>

<div class="bg"></div>

<!-- ===========================
      HEADER
=========================== -->
<header>
  <nav class="nav">
    <a class="logo" href="index.html">
      <img src="assets/img/logo.jpg"><span class="brand">Power Lab</span>
    </a>
    <div class="right">
      <button class="back" onclick="location.href='index.html#marcas'">Volver</button>
    </div>
  </nav>
</header>

<!-- ===========================
      CONTENIDO PRINCIPAL
=========================== -->
<main>

  <div class="title">
    <img src="assets/img/star.jpg">
    <div>
      <h1>Catálogo · Star Nutrition</h1>
      <small>Elegí tu producto · Precios en ARS</small>
    </div>
  </div>

  <!-- ===========================
        FILTROS
  =========================== -->
  <div class="filters">
    <input id="q" class="input" placeholder="Buscar...">
    <select id="cat" class="select">
      <option value="todas">Todas las categorías</option>
      <option value="creatina">Creatina</option>
      <option value="proteina">Proteína</option>
      <option value="pre">Pre-entreno</option>
      <option value="amino">Aminoácidos</option>
      <option value="multi">Multivitamínico</option>
      <option value="salud">Salud</option>
    </select>
    <select id="sort" class="select">
      <option value="rec">Recomendado</option>
      <option value="precioAsc">Menor precio</option>
      <option value="precioDesc">Mayor precio</option>
      <option value="az">A-Z</option>
    </select>
  </div>

  <!-- ===========================
        SECCIONES POR CATEGORÍA
  =========================== -->
  <section class="group" id="g-creatina"><h2>Creatina <span id="c-creatina"></span></h2><div class="grid" data-cat="creatina"></div></section>
  <section class="group" id="g-proteina"><h2>Proteína <span id="c-proteina"></span></h2><div class="grid" data-cat="proteina"></div></section>
  <section class="group" id="g-pre"><h2>Pre-entreno <span id="c-pre"></span></h2><div class="grid" data-cat="pre"></div></section>
  <section class="group" id="g-amino"><h2>Aminoácidos <span id="c-amino"></span></h2><div class="grid" data-cat="amino"></div></section>
  <section class="group" id="g-multi"><h2>Multivitamínico <span id="c-multi"></span></h2><div class="grid" data-cat="multi"></div></section>
  <section class="group" id="g-salud"><h2>Salud <span id="c-salud"></span></h2><div class="grid" data-cat="salud"></div></section>

</main>

<!-- ===========================
      FOOTER
=========================== -->
<footer>
  <div class="foot">
    <small>© 2025 Power Lab · proteinpowerlab@gmail.com</small>
    <div class="socials">
      <a href="https://www.facebook.com/share/19rj9UoysD/" target="_blank">FB</a>
      <a href="https://www.instagram.com/powerlab_arg" target="_blank">IG</a>
    </div>
  </div>
</footer>

<!-- ===========================
      WHATSAPP
=========================== -->
<a href="https://wa.me/5491171484334" class="whatsapp-fab">
  <svg viewBox="0 0 32 32"><path d="M16.003 3c-7.168...."/></svg>
</a>

<!-- ===========================
      SCRIPT (ORDENADO COMO ENA)
=========================== -->
<script>

  /* ========= BASE IMÁGENES ========= */
  const IMG_BASE = 'assets/img/';

  /* ========= PRODUCTOS ========= */
  const PRODUCTS=[
    {cat:'creatina', name:'Creatina 150g', price:20000, img:'Creatina_150g.jpg'},
    {cat:'creatina', name:'Creatina 300g (doypack)', price:34000, img:'Creatina_300g_doypack.jpg'},
    {cat:'creatina', name:'Creatina 300g (pote)', price:37000, img:'Creatina_300g_pote.jpg'},
    {cat:'creatina', name:'Creatina 500g', price:52000, img:'Creatina_500g.jpg'},
    {cat:'creatina', name:'Creatina 1kg', price:85000, img:'Creatina_1kg.jpg'},

    {cat:'proteina', name:'Whey Protein 2LB', price:48000, img:'Whey_Protein_2LB_vainilla_chocolate_frutilla_cookies_banana.jpg'},

    {cat:'pre', name:'Pump V8 285g', price:38000, img:'Pump_V8_285g_acai_lima_limon_grape_watermelon.jpg'},
    {cat:'pre', name:'Pump 3D Ripped 315g', price:null, img:'Pump_3D_Ripped_315g_lemon_strawberry_lemon.jpg'},

    {cat:'amino', name:'Mtor BCAA 270g', price:30000, img:'Mtor_BCAA_270g.jpg'},
    {cat:'amino', name:'EAA Essential 360g', price:40000, img:'EAÁs_Essential_Aminos_360gr.jpg'},
    {cat:'amino', name:'L-Glutamina 300g', price:null, img:'L-glutamine-300g.jpg'},

    {cat:'multi', name:'All in One Vitamin 60caps', price:null, img:'All_in_One_Vitamin_60caps.jpg'},
    {cat:'multi', name:'ZMA 90caps', price:null, img:'ZMA.jpg'},

    {cat:'salud', name:'Omega3 60caps', price:32000, img:'Omega3_60caps.jpg'},
    {cat:'salud', name:'Magnesio 60caps', price:17500, img:'Magnesio_sin_sabor_60caps.jpg'},
    {cat:'salud', name:'Colágeno Hidrolizado 300g', price:21000, img:'Colageno.jpg'}
  ];

  /* ========= SELECTORES ========= */
  const q=document.getElementById('q');
  const cat=document.getElementById('cat');
  const sort=document.getElementById('sort');

  /* ========= OBSERVER ========= */
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  });

  /* ========= FUNCIONES ========= */
  const pesos=v=> v ? v.toLocaleString('es-AR',{style:'currency',currency:'ARS'}) : null;

  function card(p){
    const el=document.createElement('article');
    el.className='card';

    const priceHTML = p.price ? pesos(p.price) : `<span class="nostock">Sin stock</span>`;

    el.innerHTML = `
      <div class="media">
        <img loading="lazy" src="${IMG_BASE+p.img}">
      </div>
      <div class="body">
        <h3>${p.name}</h3>
        <div class="price">${priceHTML}</div>
      </div>
    `;
    io.observe(el);
    return el;
  }

  /* ========= RENDER ========= */
  function render(){
    document.querySelectorAll('.grid').forEach(g=>g.innerHTML="");

    const term = q.value.toLowerCase();
    const catVal = cat.value;

    let data = PRODUCTS.filter(p=>{
      const okCat = (catVal==="todas") || p.cat===catVal;
      const okTerm = !term || p.name.toLowerCase().includes(term);
      return okCat && okTerm;
    });

    if(sort.value==="precioAsc") data.sort((a,b)=>(a.price||1e12)-(b.price||1e12));
    if(sort.value==="precioDesc") data.sort((a,b)=>(b.price||-1)-(a.price||-1));
    if(sort.value==="az") data.sort((a,b)=>a.name.localeCompare(b.name));

    const counts={creatina:0,proteina:0,pre:0,amino:0,multi:0,salud:0};
    data.forEach(p=>counts[p.cat]++);

    Object.keys(counts).forEach(k=>{
      document.getElementById("c-"+k).textContent = counts[k];
      document.getElementById("g-"+k).style.display = counts[k] ? "" : "none";
    });

    data.forEach(p=>{
      const g=document.querySelector(`.grid[data-cat="${p.cat}"]`);
      if(g) g.appendChild(card(p));
    });
  }

  /* ========= EVENTOS + INICIO ========= */
  q.addEventListener('input',render);
  cat.addEventListener('change',render);
  sort.addEventListener('change',render);
  render();

</script>

</body>
</html>
