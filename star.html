<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Star Nutrition</title>

<!-- TIPOGRAFÍA -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- ===========================
      ESTILOS GENERALES
=========================== -->
<style>
  :root{ --bg:#0e0e0f; --muted:#cfcfcf; --text:#f3f3f3; --accent:#FF6A00; --radius:16px; --shadow:0 20px 60px rgba(0,0,0,.55); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
  .bg{position:fixed;inset:0;z-index:-2;background:url('assets/img/bg-texture.jpg') center/cover no-repeat;filter:contrast(1.02) brightness(.82)}
  .bg::after{content:"";position:absolute;inset:0;background:
    radial-gradient(1100px 520px at 50% 0, rgba(255,106,0,.16), transparent 60%),
    linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.6))}

  /* ===========================
        HEADER
  =========================== */
  header{position:sticky;top:0;z-index:50;background:rgba(14,14,15,.6);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06)}
  .nav{width:100%;display:flex;align-items:center;gap:12px;padding:12px 20px}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;margin-right:auto}
  .logo img{height:40px;width:40px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.1);background:#000}
  .brand{font-weight:800}
  .pill{display:none!important}
  .right{margin-left:auto;font-size:0}
  .right .back{font-size:.95rem;display:inline-flex;align-items:center;background:var(--accent);color:#111;font-weight:800;border:none;border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 6px 18px rgba(255,106,0,.3)}
  .right .back:hover{transform:translateY(-1px)}

  /* ===========================
        CONTENIDO Y TARJETAS
  =========================== */
  main{max-width:1200px;margin:26px auto 80px;padding:0 20px}
  .title{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
  .title img{height:42px;width:42px;object-fit:contain}
  .title h1{font-size:clamp(1.55rem,3vw,2.2rem);line-height:1.1;font-weight:800}
  .title small{color:var(--muted)}

  .filters{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
  .input,.select{
    background:#fffaf6;color:#111;border:1px solid rgba(255,106,0,.25);
    border-radius:12px;padding:12px 14px;font-weight:700;min-width:220px;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }

  .group{margin:30px 0 36px}
  .group h2{font-weight:900;letter-spacing:.3px;margin:0 0 14px;position:relative}
  .group h2::after{content:"";position:absolute;left:0;bottom:-6px;width:72px;height:3px;background:linear-gradient(90deg,var(--accent),transparent);border-radius:2px}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .card{grid-column:span 12;background:rgba(25,25,26,.9);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transform:translateY(10px);opacity:0;transition:transform .5s,opacity .5s}
  .card.in{transform:translateY(0);opacity:1}

  .media{background:#0f0f10;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;min-height:220px}
  .media img{display:block;width:100%;height:260px;object-fit:contain;background:#fff}
  .body{padding:18px}
  .badge{display:inline-block;margin-bottom:8px;background:rgba(255,106,0,.12);color:#ffd9c2;padding:6px 10px;border:1px solid rgba(255,106,0,.25);border-radius:999px;font-size:.85rem;font-weight:800}
  .body h3{font-size:1.12rem;color:#fff;margin:4px 0 6px;font-weight:800}
  .body p{color:#dcdcdc;font-size:.98rem}
  .price{margin-top:10px;font-weight:900;font-size:1.1rem;color:#fff}
  .price .nostock{color:#ffcf9e;background:rgba(255,106,0,.14);padding:3px 8px;border-radius:8px;border:1px solid rgba(255,106,0,.3)}

  /* FOOTER + WHATSAPP */
  footer{border-top:1px solid rgba(255,255,255,.08);background:rgba(10,10,10,.9);backdrop-filter:blur(6px);margin-top:auto}
  .foot{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 40px}
  .foot small{color:#b5b5b5}
  .socials{display:flex;gap:12px;margin-left:auto;margin-right:100px}

  .whatsapp-fab{position:fixed;right:18px;bottom:18px;z-index:9999;width:68px;height:68px;border-radius:50%;background:#25D366;display:grid;place-items:center}
</style>
</head>

<body>

<div class="bg"></div>

<!-- ===========================
      HEADER
=========================== -->
<header>
  <nav class="nav">
    <a class="logo" href="index.html">
      <img src="assets/img/logo.jpg" alt="">
      <span class="brand">Power Lab</span>
    </a>
    <div class="right">
      <button class="back" onclick="location.href='index.html#marcas'">Volver</button>
    </div>
  </nav>
</header>

<!-- ===========================
      CONTENIDO PRINCIPAL
=========================== -->
<main>
  <div class="title">
    <img src="assets/img/star.jpg" alt="Star Nutrition">
    <div>
      <h1>Catálogo · Star Nutrition</h1>
      <small>Elegí tu producto. Precios en ARS.</small>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="filters">
    <input id="q" class="input" placeholder="Buscar... (ej: creatina, whey, v8)">
    <select id="cat" class="select">
      <option value="todas">Todas las categorías</option>
      <option value="creatina">Creatina</option>
      <option value="proteina">Proteína</option>
      <option value="pre">Pre-entreno</option>
      <option value="amino">Aminoácidos</option>
      <option value="multi">Multivitamínico</option>
      <option value="salud">Salud</option>
    </select>
    <select id="sort" class="select">
      <option value="rec">Orden: recomendado</option>
      <option value="precioAsc">Menor precio</option>
      <option value="precioDesc">Mayor precio</option>
      <option value="az">A-Z</option>
    </select>
  </div>

  <!-- SECCIONES POR CATEGORÍA -->
  <section class="group" id="g-creatina"><h2>Creatina <span class="chip" id="c-creatina">0</span></h2><div class="grid" data-cat="creatina"></div></section>
  <section class="group" id="g-proteina"><h2>Proteína <span class="chip" id="c-proteina">0</span></h2><div class="grid" data-cat="proteina"></div></section>
  <section class="group" id="g-pre"><h2>Pre-entreno <span class="chip" id="c-pre">0</span></h2><div class="grid" data-cat="pre"></div></section>
  <section class="group" id="g-amino"><h2>Aminoácidos <span class="chip" id="c-amino">0</span></h2><div class="grid" data-cat="amino"></div></section>
  <section class="group" id="g-multi"><h2>Multivitamínico <span class="chip" id="c-multi">0</span></h2><div class="grid" data-cat="multi"></div></section>
  <section class="group" id="g-salud"><h2>Salud <span class="chip" id="c-salud">0</span></h2><div class="grid" data-cat="salud"></div></section>

</main>

<!-- FOOTER -->
<footer>
  <div class="foot">
    <small>© 2025 Power Lab. Todos los derechos reservados. · Contacto: proteinpowerlab@gmail.com</small>
    <div class="socials"></div>
  </div>
</footer>

<!-- WHATSAPP -->
<a href="https://wa.me/5491171484334" target="_blank" class="whatsapp-fab">
  <svg viewBox="0 0 32 32"><path d="M16.003 3c-7.168 0-13 5.832-13 13 0 2.294.61 4.534 1.767 6.503L3 29l6.68-1.74A12.9 12.9 0 0 0 16.003 29c7.168 0 13-5.832 13-13s-5.832-13-13-13zm0 23.64a10.57 10.57 0 0 1-5.378-1.48l-.385-.228-3.965 1.034 1.06-3.87-.25-.397A10.56 10.56 0 0 1 5.43 16c0-5.832 4.74-10.57 10.573-10.57 2.823 0 5.474 1.1 7.467 3.095a10.55 10.55 0 0 1 3.106 7.475c0 5.833-4.74 10.57-10.573 10.57z"/></svg>
</a>

<!-- ===========================
        SCRIPT ORDENADO COMO ENA
=========================== -->
<script>

  /* ===========================
        BASE DE IMÁGENES
  =========================== */
  const IMG_BASE='assets/img/';

  /* ===========================
        LISTA DE PRODUCTOS
  =========================== */
  const PRODUCTS=[
    // CREARTINA
    {cat:'creatina', name:'Creatina 150g', price:20000, img:'Creatina_150g.jpg', desc:'Pura y micronizada.'},
    {cat:'creatina', name:'Creatina 300g (doypack)', price:34000, img:'Creatina_300g_doypack.jpg', desc:'Pura y micronizada.'},
    {cat:'creatina', name:'Creatina 300g (pote)', price:37000, img:'Creatina_300g_pote.jpg', desc:'Pura y micronizada.'},
    {cat:'creatina', name:'Creatina 500g', price:52000, img:'Creatina_500g.jpg', desc:'Pura y micronizada.'},
    {cat:'creatina', name:'Creatina 1kg', price:85000, img:'Creatina_1kg.jpg', desc:'Pura y micronizada.'},

    // PROTEÍNA
    {cat:'proteina', name:'Whey Protein 2LB (vainilla, chocolate, frutilla, cookies, banana)', price:48000, img:'Whey_Protein_2LB_vainilla_chocolate_frutilla_cookies_banana.jpg', desc:'Excelente disolución.'},

    // PRE ENTRENOS
    {cat:'pre', name:'Pump V8 285g (acai, lima limon, grape, watermelon)', price:38000, img:'Pump_V8_285g_acai_lima_limon_grape_watermelon.jpg', desc:'Energía y enfoque.'},
    {cat:'pre', name:'Pump 3D Ripped 315g (lemon, strawberry lemon)', price:null, img:'Pump_3D_Ripped_315g_lemon_strawberry_lemon.jpg', desc:'Energía y enfoque. 3D Ripped.'},

    // AMINOS
    {cat:'amino', name:'Mtor BCAA 270g', price:30000, img:'Mtor_BCAA_270g.jpg', desc:'BCAA 2:1:1.'},
    {cat:'amino', name:"EAA's Essential Aminos 360g", price:40000, img:'EAÁs_Essential_Aminos_360gr.jpg', desc:'Aminoácidos esenciales.'},
    {cat:'amino', name:'L-Glutamina 300g', price:null, img:'L-glutamine-300g.jpg', desc:'Recuperación muscular e inmunidad.'},

    // MULTIVITAMÍNICO
    {cat:'multi', name:'All in One Vitamin 60caps', price:null, img:'All_in_One_Vitamin_60caps.jpg', desc:'Vitaminas y minerales.'},
    {cat:'multi', name:'ZMA 90caps', price:null, img:'ZMA.jpg', desc:'Magnesio + zinc + descanso.'},

    // SALUD
    {cat:'salud', name:'Omega3 60caps', price:32000, img:'Omega3_60caps.jpg', desc:'EPA / DHA.'},
    {cat:'salud', name:'Magnesio sin sabor 60caps', price:17500, img:'Magnesio_sin_sabor_60caps.jpg', desc:'Apoyo muscular.'},
    {cat:'salud', name:'Colágeno Hidrolizado 300g (limón / frutos rojos)', price:21000, img:'Colageno.jpg', desc:'Articulaciones, piel, uñas.'}
  ];

  /* ===========================
        SELECTORES Y OBSERVER
  =========================== */
  const q=document.getElementById('q');
  const cat=document.getElementById('cat');
  const sort=document.getElementById('sort');

  const io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  },{threshold:.18});

  /* ===========================
        LABELS POR CATEGORÍA
  =========================== */
  const label=c=>({
    creatina:'Creatina',
    proteina:'Proteína',
    pre:'Pre-entreno',
    amino:'Aminoácidos',
    multi:'Multivitamínico',
    salud:'Salud'
  }[c]||c);

  /* ===========================
        FORMATO PRECIO
  =========================== */
  const pesos=v=>v.toLocaleString('es-AR',
    {style:'currency',currency:'ARS',maximumFractionDigits:0});

  /* ===========================
        TARJETA DE PRODUCTO
  =========================== */
  function card(p){
    const priceHtml= (p.price && p.price>0)
      ? `<div class="price">${pesos(p.price)}</div>`
      : `<div class="price"><span class="nostock">Sin stock</span></div>`;

    const imgSRC=/^https?:/i.test(p.img) ? p.img : IMG_BASE+p.img;

    const el=document.createElement('article');
    el.className='card';
    el.innerHTML=`
      <div class="media"><img loading="lazy" src="${imgSRC}" alt="${p.name}"></div>
      <div class="body">
        <span class="badge">${label(p.cat)}</span>
        <h3>${p.name}</h3>
        <p>${p.desc||''}</p>
        ${priceHtml}
      </div>
    `;
    io.observe(el);
    return el;
  }

  /* ===========================
        RENDER PRINCIPAL
  =========================== */
  function render(){
    document.querySelectorAll('.grid').forEach(g=>g.innerHTML='');

    const term=(q.value||'').trim().toLowerCase();
    const catVal=cat.value;

    let data=PRODUCTS.filter(p=>{
      const okCat=(catVal==='todas' || p.cat===catVal);
      const okTerm=!term || p.name.toLowerCase().includes(term) || (p.desc||'').toLowerCase().includes(term);
      return okCat && okTerm;
    });

    if(sort.value==='precioAsc') data.sort((a,b)=>(a.price||1e12)-(b.price||1e12));
    if(sort.value==='precioDesc') data.sort((a,b)=>(b.price||-1)-(a.price||-1));
    if(sort.value==='az') data.sort((a,b)=>a.name.localeCompare(b.name));

    const counts={creatina:0,proteina:0,pre:0,amino:0,multi:0,salud:0};
    data.forEach(p=>counts[p.cat]++);

    Object.keys(counts).forEach(k=>{
      document.getElementById('c-'+k).textContent=counts[k];
      document.getElementById('g-'+k).style.display = counts[k] ? '' : 'none';
    });

    data.forEach(p=>{
      const g=document.querySelector(`.grid[data-cat="${p.cat}"]`);
      if(g) g.appendChild(card(p));
    });
  }

  /* ===========================
        EVENTOS
  =========================== */
  q.addEventListener('input',render);
  cat.addEventListener('change',render);
  sort.addEventListener('change',render);

  /* ===========================
        EJECUTAR INICIAL
  =========================== */
  render();

</script>

</body>
</html>
